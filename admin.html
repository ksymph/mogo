<script>
  function getSystemTheme() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    // If no argument, read from localStorage, fallback to 'auto'
    theme = theme || localStorage.getItem('mogo_theme') || 'auto';

    // Determine the actual class to apply
    let effectiveTheme = theme;
    if (effectiveTheme === 'auto') {
      effectiveTheme = getSystemTheme();
    }

    // Remove any existing theme class and apply the new one
    document.documentElement.classList.remove('theme-light', 'theme-dark');
    document.documentElement.classList.add(`theme-${effectiveTheme}`);

    // Store the user's preference (not the resolved theme)
    localStorage.setItem('mogo_theme', theme);
  }

  // Run on page load
  applyTheme();

  // Optional: listen for system preference changes when in 'auto' mode
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (localStorage.getItem('mogo_theme') === 'auto') {
      applyTheme('auto');
    }
  });

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        if (e.target.id === 'rel-modal') {
          closeRelModal();
        } else if (e.target.id === 'modal') {
          closeModal();
        }
      }
    });
    
  let state = {
    tab: '', sub: '', data: [], schema:[], selected: new Set(),
    collections: [], keys: [], crons:[], settings: null,
    environment: 'production',
    sort: { col: 'id', asc: true },
    openFolders: {}
  };

  window.fileEditorCache = {}; // Tracks the last opened file per section: base -> { path, element, editor, originalContent }
  window.activeEditor = null;  // Pointer to the currently active editor instance

  // Intercept Navigation logic for Single Page App architecture and Warn if Unsaved changes
  window.handleNavClick = function(e, tab) {
      if (e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
          e.preventDefault();
          
          // Warn only when navigating to a DIFFERENT main sidebar section
          if (window.activeEditor) {
              let cache = window.activeEditor;
              if (cache.editor.value !== cache.originalContent) {
                  if (!confirm("You have unsaved changes in the active file. Are you sure you want to navigate away?")) {
                      return;
                  }
              }
          }

          nav(tab);
          window.history.pushState({}, '', '?tab=' + tab);
      }
  };

  window.addEventListener('popstate', (e) => {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab') || 'collections';
      nav(tab);
  });

  // Listen for native <details> toggle events to save open/closed states
  document.addEventListener('toggle', (e) => {
    if (e.target.tagName === 'DETAILS') {
      const summary = e.target.querySelector('summary.tree-item');
      if (summary && state.tab && state.openFolders[state.tab]) {
        const path = summary.getAttribute('data-path') || '';
        if (e.target.open) {
          state.openFolders[state.tab].add(path);
        } else {
          state.openFolders[state.tab].delete(path);
        }
      }
    }
  }, true); // Use capture phase because 'toggle' events do not bubble

  function handleSort(col) {
      if (state.sort.col === col) {
        state.sort.asc = !state.sort.asc;
      } else {
        state.sort.col = col;
        state.sort.asc = true;
      }
      if (state.tab === 'collections') renderCollectionTable();
      if (state.tab === 'settings' && state.sub === 'keys') renderKeysTable();
      if (state.tab === 'schedules') renderCronsTable();
    }

    function sortData(arr) {
      let { col, asc } = state.sort;
      return arr.sort((a, b) => {
        let va = a[col];
        let vb = b[col];
        if (va === vb) return 0;
        if (va == null) return asc ? -1 : 1;
        if (vb == null) return asc ? 1 : -1;
        if (typeof va === 'string' && typeof vb === 'string') {
          return asc ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        return asc ? (va < vb ? -1 : 1) : (va > vb ? -1 : 1);
      });
    }

    function th(col, label) {
      let arrow = state.sort.col === col ? (state.sort.asc ? ' ▲' : ' ▼') : '';
      return `<th onclick="handleSort('${col}')" class="sortable-header">${label || col}${arrow}</th>`;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('modal').style.display === 'flex') {
        closeModal();
      }
      // Enter to confirm modals
      if (e.key === 'Enter' && document.getElementById('modal').style.display === 'flex') {
        if (e.target.tagName === 'TEXTAREA') return; // Allow newlines in textareas
        const confirmBtn = document.getElementById('modal-confirm-btn');
        if (confirmBtn && !confirmBtn.disabled) {
          e.preventDefault();
          confirmBtn.click();
        }
      }
      // Ctrl+S or Cmd+S to save file
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        const saveBtn = document.getElementById('btn-save-file');
        if (saveBtn && !saveBtn.disabled) {
          e.preventDefault();
          saveBtn.click();
        } else if (saveBtn && saveBtn.disabled) {
          e.preventDefault(); // Prevent browser save dialog even if no changes
        }
      }
    });

    function esc(s) { return s.replace(/'/g, "\\'"); }

    async function api(path, opts = {}) {
      opts.headers = opts.headers || {};
      // Only set JSON content type if it's not a FormData upload
      if (!(opts.body instanceof FormData)) {
        opts.headers["Content-Type"] = "application/json";
        if (opts.body && typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
      }
      
      const res = await fetch(`/api${path}`, opts);
      if (res.status === 401) { showLogin(); throw new Error("Unauthorized"); }
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    // ---------- Drag and Drop List Reordering logic ----------
    let dragInfo = null;
    window.startDrag = function (e, index) {
      if (e.button !== 0) return; // Allow only left click
      e.preventDefault();

      const container = document.getElementById('schema-fields-container');
      const row = e.target.closest('.schema-row');
      const rect = row.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();

      const placeholder = document.createElement('div');
      placeholder.className = 'hbox schema-row placeholder';
      placeholder.style.height = rect.height + 'px';
      placeholder.style.border = '2px dashed var(--bg-3)';
      placeholder.style.borderRadius = '4px';
      placeholder.style.boxSizing = 'border-box';

      row.style.position = 'absolute';
      row.style.zIndex = '1000';
      row.style.width = rect.width + 'px';
      row.style.top = (rect.top - containerRect.top) + 'px';
      row.style.left = (rect.left - containerRect.left) + 'px';
      row.style.boxShadow = 'var(--shadow)';
      row.style.background = 'var(--card-bg)'; // Maintain visual block integrity

      container.insertBefore(placeholder, row.nextSibling);

      const startY = e.clientY;
      const startTop = rect.top - containerRect.top;

      dragInfo = { row, placeholder, container, startY, startTop, index };

      document.addEventListener('pointermove', window.onDragMove);
      document.addEventListener('pointerup', window.onDragEnd);
    };

    window.onDragMove = function (e) {
      if (!dragInfo) return;
      e.preventDefault();
      const { row, placeholder, container, startY, startTop } = dragInfo;

      // Update visual positioning relative to drag
      const dy = e.clientY - startY;
      row.style.top = (startTop + dy) + 'px';

      const siblings = Array.from(container.children).filter(c => c !== row && c !== placeholder && c.classList.contains('schema-row'));
      const rowCenter = e.clientY;

      let inserted = false;
      for (let i = 0; i < siblings.length; i++) {
        const rect = siblings[i].getBoundingClientRect();
        if (rowCenter < rect.top + rect.height / 2) {
          container.insertBefore(placeholder, siblings[i]);
          inserted = true;
          break;
        }
      }
      if (!inserted) {
        container.appendChild(placeholder);
      }
    };

    window.onDragEnd = function (e) {
      if (!dragInfo) return;
      document.removeEventListener('pointermove', window.onDragMove);
      document.removeEventListener('pointerup', window.onDragEnd);

      const { row, placeholder, container, index } = dragInfo;

      // Measure placeholder's final DOM location to translate to schema array offset
      const siblingsAndPlaceholder = Array.from(container.children).filter(c => c.classList.contains('schema-row') && c !== row);
      const newIndex = siblingsAndPlaceholder.indexOf(placeholder);

      row.style.position = '';
      row.style.zIndex = '';
      row.style.width = '';
      row.style.top = '';
      row.style.left = '';
      row.style.boxShadow = '';
      row.style.background = '';

      container.insertBefore(row, placeholder);
      placeholder.remove();

      // Reorder items in state tracking variable
      if (newIndex !== -1 && newIndex !== index) {
        const item = window._tempSchema.splice(index, 1)[0];
        window._tempSchema.splice(newIndex, 0, item);
        renderSchemaModal();
      }

      dragInfo = null;
    };


    // ---------- logs ----------
    async function loadLogs(level = '', offset = 0) {
      document.getElementById('pane-header').innerHTML = `
        <h2>Logs</h2>
        <div style="display:flex; gap: 8px;">
          <select id="log-level-filter" onchange="loadLogs(this.value, 0)">
            <option value="">All Levels</option>
            <option value="info" ${level === 'info' ? 'selected' : ''}>Info</option>
            <option value="warn" ${level === 'warn' ? 'selected' : ''}>Warn</option>
            <option value="error" ${level === 'error' ? 'selected' : ''}>Error</option>
          </select>
          <button class="btn danger" onclick="clearLogs()">Clear All Logs</button>
        </div>
      `;

      const res = await api(`/logs?level=${level}`);
      const logs = res.logs ||[];
      state.logs = logs; // save for viewing details

      let html = `<table class="data-table"><thead><tr>
        <th>ID</th><th>Timestamp</th><th>Level</th><th>Origin</th><th>Script</th><th>Message</th>
      </tr></thead><tbody>`;

      if (logs.length === 0) {
        html += `<tr style="box-shadow: none;"><td colspan="6" style="text-align:center; padding: 2rem; cursor: default;">No logs found.</td></tr>`;
      } else {
        logs.forEach((l, idx) => {
          let badgeColor = l.level === 'error' ? 'var(--fail)' : (l.level === 'warn' ? 'var(--warn)' : 'var(--success)');
          let shortMsg = l.message ? (l.message.length > 60 ? l.message.substring(0, 60) + '...' : l.message) : '';
          shortMsg = shortMsg.replace(/</g, "&lt;");
          html += `<tr style="cursor:pointer" onclick="viewLogDetail(${idx})">
            <td>${l.id}</td>
            <td style="white-space:nowrap">${new Date(l.timestamp).toLocaleString()}</td>
            <td><span style="background:${badgeColor};">${l.level}</span></td>
            <td>${l.origin || ''}</td>
            <td>${l.script_path || ''}</td>
            <td style="max-width:300px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"><code>${shortMsg}</code></td>
          </tr>`;
        });
      }
      html += `</tbody></table>`;


      document.getElementById('pane-content').innerHTML = html;
    }

    async function clearLogs() {
      if (!confirm("Are you sure you want to delete ALL logs? This cannot be undone.")) return;
      await api('/logs', { method: 'DELETE' });
      loadLogs(document.getElementById('log-level-filter').value, 0);
    }

    function viewLogDetail(idx) {
      let l = state.logs[idx];
      document.getElementById('modal-title').innerText = `Log #${l.id}`;
      document.getElementById('modal-body').innerHTML = `
        <div class="log">
        <span><b>Timestamp</b>: ${new Date(l.timestamp).toLocaleString()}</span>
        <span><b>Level</b>:       ${l.level}</span>
        <span><b>Origin</b>:      ${l.origin}</span>
        <span><b>Script</b>:      ${l.script_path}</span>
        <hr>
        <div>${l.message ? l.message.replace(/</g, "&lt;") : ''}</div>
        </div>
      `;
      document.getElementById('modal').style.display = 'flex';
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const autoKey = params.get('key');
      if (autoKey) {
        window.history.replaceState({}, document.title, window.location.pathname);
        try { await api('/auth/login', { method: 'POST', body: { api_key: autoKey } }); }
        catch (e) { /* ignore auto-login failure */ }
      }

      try {
        const authRes = await api('/auth/check');
        state.environment = authRes.environment;
        if (state.environment === 'production') {
          state.settings = await api('/settings');
        } else {
          state.settings = {};
        }
        showApp();
      } catch { showLogin(); }
    }

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/auth/login', { method: 'POST', body: { api_key: document.getElementById('api-key').value } });
        const authRes = await api('/auth/check');
        state.environment = authRes.environment;
        if (state.environment === 'production') {
          state.settings = await api('/settings');
        } else {
          state.settings = {};
        }
        showApp();
      } catch (e) { alert("Invalid API Key"); }
    };

    function showLogin() { document.getElementById('app-view').style.display = 'none'; document.getElementById('login-view').style.display = 'flex'; }
    
    function showApp() { 
      document.getElementById('login-view').style.display = 'none'; 
      document.getElementById('app-view').style.display = 'flex'; 
      
      if (state.environment === 'staging') {
        document.getElementById('nav-staging-btn').style.display = 'none';
        document.getElementById('nav-settings-btn').style.display = 'none';
        document.getElementById('staging-label').style.display = 'flex';
      } else {
        document.getElementById('nav-staging-btn').style.display = (state.settings && state.settings.staging_enabled) ? 'flex' : 'none';
        document.getElementById('nav-settings-btn').style.display = 'flex';
        document.getElementById('staging-label').style.display = 'none';
      }

      const params = new URLSearchParams(window.location.search);
      const initialTab = params.get('tab') || 'collections';
      nav(initialTab); 
    }

    function nav(tab) {
      if (window.activeEditor && window.activeEditor.element && window.activeEditor.element.parentNode) {
          window.activeEditor.element.parentNode.removeChild(window.activeEditor.element);
      }
      window.activeEditor = null; // Leaving the current view

      state.tab = tab; state.sub = ''; state.search = '';
      state.sort = { col: 'id', asc: true };
      document.querySelectorAll('.icon-btn').forEach(e => e.classList.remove('active'));

      let iconBtn = document.querySelector(`.icon-btn[href="?tab=${tab}"]`);
      if (iconBtn) iconBtn.classList.add('active');

      document.getElementById('sub-sidebar').style.display =['collections', 'routes', 'public', 'schedules', 'settings'].includes(tab) ? 'flex' : 'none';
      document.getElementById('pane-header').style.display = 'flex';
      document.getElementById('pane-header').innerHTML = '';
      document.getElementById('pane-content').innerHTML = '';
      document.getElementById('selection-popup').classList.remove('show');

      if (tab === 'collections') loadCollections();
      if (tab === 'settings') loadSettings('admin');
      if (tab === 'staging') loadStaging();
      if (tab === 'logs') loadLogs();
      if (tab === 'routes' || tab === 'public' || tab === 'schedules') loadFiles(tab);
    }

    // ---------- collections ----------
    async function loadCollections() {
      const cols = await api('/collections');
      state.collections = cols;
      let html = cols.map(c => `<div class="sub-item ${c.name === state.sub ? 'active' : ''}" onclick="viewCollection('${c.name}')">${c.name}</div>`).join('');
      html += `<button class="btn btn-block" onclick="editSchemaModal()">+ New Collection</button>`;
      document.getElementById('sub-sidebar').innerHTML = html;

      if (cols.length > 0 && !state.sub) {
        viewCollection(cols[0].name);
      } else if (cols.length === 0) {
        document.getElementById('pane-header').innerHTML = '<h2>Collections</h2>';
        document.getElementById('pane-content').innerHTML = '<p style="padding:1.5rem">No collections found.</p>';
      }
    }
    
    async function deleteSingleItem(id) {
      if (confirm("Are you sure you want to delete this item?")) {
        await api(`/collections/${state.sub}?ids=${id}`, { method: 'DELETE' });
        closeModal();
        viewCollection(state.sub);
      }
    }

    async function viewCollection(name) {
      state.sub = name;
      state.sort = { col: 'id', asc: true };
      document.querySelectorAll('.sub-sidebar .sub-item').forEach(el => el.classList.remove('active'));
      const subItem = Array.from(document.querySelectorAll('.sub-sidebar .sub-item')).find(el => el.innerText === name);
      if (subItem) subItem.classList.add('active');

      const col = state.collections.find(c => c.name === name);
      if (!col) return;

      state.schema = col.schema ||[];
      const res = await api(`/collections/${name}?search=${encodeURIComponent(state.search || '')}`);
      state.data = res.items ||[];

      state.selected.clear();
      renderCollectionTable();
    }

    function renderCollectionTable() {
      const cols =['id', ...state.schema.map(s => s.name), 'created', 'updated'];
      document.getElementById('pane-header').innerHTML = `
      <h2>${state.sub}</h2>
      <div class="hbox">
        <div class="form-field" style="margin:0; width:250px"><input type="text" id="coll-search" placeholder=" " value="${state.search || ''}" oninput="debounceSearch(this.value)"><label>Search (or field:value)...</label></div>
        <button class="btn danger" onclick="deleteCollection('${state.sub}')">Delete Collection</button>
        <button class="btn" onclick="editSchemaModal('${state.sub}')">Edit Schema</button>
        <button class="btn" onclick="itemModal()">+ Item</button>
      </div>
    `;
      let ths = cols.map(c => th(c, c)).join('');

      let sortedData = sortData([...state.data]);

      let rows = sortedData.map(d => `
      <tr onclick="itemModal('${d.id}')">
        <td onclick="event.stopPropagation()"><input type="checkbox" onchange="toggleSelect('${d.id}', this.checked)" ${state.selected.has(String(d.id)) ? 'checked' : ''}></td>
        ${cols.map(c => {
        let val = d[c];
        if (c === 'created' || c === 'updated') {
          if (val) {
            let numVal = Number(val);
            let ms = numVal > 1e11 ? numVal : numVal * 1000;
            return `<td>${new Date(ms).toLocaleString()}</td>`;
          }
          return `<td></td>`;
        }
        let sc = state.schema.find(s => s.name === c);
        if (sc && sc.type === 'bool') {
          if (val === undefined || val === null || val === '') return `<td></td>`;
          return `<td>${(val === true || val === 1 || val === 'true') ? 'true' : 'false'}</td>`;
        }
        return `<td>${val !== undefined && val !== null ? val : ''}</td>`;
      }).join('')}
      </tr>
    `).join('');


      document.getElementById('pane-content').innerHTML = `
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead><tr><th style="width:30px"></th>${ths}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
    }

    function toggleSelect(id, checked) {
      let strId = String(id);
      checked ? state.selected.add(strId) : state.selected.delete(strId);
      document.getElementById('selection-popup').classList.toggle('show', state.selected.size > 0);
    }

    function clearSelection() {
      state.selected.clear();
      document.getElementById('selection-popup').classList.remove('show');
      renderCollectionTable();
    }

    let searchTimeout;
    function debounceSearch(val) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        state.search = val;
        viewCollection(state.sub);
        setTimeout(() => {
          let inp = document.getElementById('coll-search');
          if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        }, 50);
      }, 300);
    }

    async function deleteSelected() {
      await api(`/collections/${state.sub}?ids=${Array.from(state.selected).join(',')}`, { method: 'DELETE' });
      clearSelection();
      viewCollection(state.sub);
    }

    async function deleteCollection(name) {
      if (confirm(`Are you sure you want to delete the collection '${name}' and all its data? This action cannot be undone.`)) {
        await api(`/collections/${name}`, { method: 'DELETE' });
        state.sub = '';
        document.getElementById('pane-header').innerHTML = '';
        document.getElementById('pane-content').innerHTML = '';
        loadCollections();
      }
    }

    function itemModal(id = null) {
      const item = id ? state.data.find(d => d.id == id) : {};
      let html = ``;
      state.schema.forEach(f => {
        if (f.name === 'id' || f.name === 'created' || f.name === 'updated') return;
        let val = item[f.name] !== undefined && item[f.name] !== null ? item[f.name] : '';

        if (f.type === 'bool') {
          html += `<div class="form-check"><label><span>${f.name}</span> <input type="checkbox" id="f_${f.name}" ${val === true || val === 1 || val === 'true' ? 'checked' : ''}></label></div>`;
        } else if (f.type === 'number') {
          html += `<div class="form-field"><input type="number" step="any" id="f_${f.name}" value="${val}" placeholder=" "><label>${f.name}</label></div>`;
        } else if (f.type === 'file') {
          html += `
            <div class="hbox">
              <div class="form-field" style="flex:1">
                <input type="text" id="f_${f.name}" value="${val}" placeholder="">
                <label>${f.name}</label>
              </div>
              <input type="file" id="file_picker_${f.name}" style="display:none" onchange="uploadCollectionFile('${f.name}', this)">
              <button class="btn secondary" onclick="document.getElementById('file_picker_${f.name}').click()">Upload</button>
            </div>
          `;
        } else if (f.type && f.type.startsWith('relation:')) {
          let target = f.type.split(':')[1];
          
          let rawArr = [];
          if (Array.isArray(val)) {
              rawArr = val.map(v => typeof v === 'object' && v !== null ? v.id : v);
          } else if (val != null) {
              rawArr = [typeof val === 'object' && val !== null ? val.id : val];
          }
          
          let displayVal = rawArr.join(', ');
          let origType = Array.isArray(val) ? 'array' : 'single';
          
          html += `
            <div class="hbox">
              <div class="form-field" style="flex:1">
                <input type="text" id="f_${f.name}" value="${displayVal}" placeholder="" readonly>
                <input type="hidden" id="f_${f.name}_raw" value='${JSON.stringify(rawArr)}'>
                <input type="hidden" id="f_${f.name}_type" value="${origType}">
                <label>${f.name}</label>
              </div>
              <button class="btn secondary" onclick="openRelSelect('${f.name}', '${target}')">Select: ${target}</button>
            </div>
          `;
        } else {
          let escapedVal = String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          html += `<div class="form-field"><textarea id="f_${f.name}" placeholder="">${escapedVal}</textarea><label>${f.name}</label></div>`;
        }
      });

      if (id) {
        let cVal = item['created'] !== undefined && item['created'] !== null ? item['created'] : '';
        let uVal = item['updated'] !== undefined && item['updated'] !== null ? item['updated'] : '';
        html += `<div class="form-field"><input type="text" value="${cVal}" readonly placeholder=" "><label>created</label></div>`;
        html += `<div class="form-field"><input type="text" value="${uVal}" readonly placeholder=" "><label>updated</label></div>`;
      }

      let idArg = id ? `'${id}'` : 'null';
      let buttonsHtml = `<div class="hbox">
        <button id="modal-confirm-btn" class="btn" onclick="saveItem(${idArg})">Save</button>`;
      
      if (id) {
        buttonsHtml += `<button class="btn danger" style="background-color: var(--danger)" onclick="deleteSingleItem('${id}')">Delete</button>`;
      }
      
      buttonsHtml += `<button class="btn danger" onclick="closeModal()">Cancel</button></div>`;

      document.getElementById('modal-title').innerText = `${id ? 'Edit' : 'New'} Item`;
      document.getElementById('modal-body').innerHTML = html + buttonsHtml;
      document.getElementById('modal').style.display = 'flex';
    }

    async function saveItem(id) {
      let payload = {};
      state.schema.forEach(f => {
        if (f.name === 'id' || f.name === 'created' || f.name === 'updated') return;
        let el = document.getElementById(`f_${f.name}`);
        if (el) {
          if (f.type === 'bool') {
            payload[f.name] = el.checked;
          } else if (f.type === 'number') {
            payload[f.name] = el.value !== '' ? parseFloat(el.value) : null;
          } else {
            payload[f.name] = el.value;
          }
        }
      });
      await api(`/collections/${state.sub}${id ? '/' + id : ''}`, { method: id ? 'PUT' : 'POST', body: payload });
      closeModal();
      viewCollection(state.sub);
    }
    
    window.uploadCollectionFile = async function(fieldName, inputEl) {
      if (!inputEl.files || !inputEl.files.length) return;
      const file = inputEl.files[0];
      const formData = new FormData();
      formData.append('path', ''); // root of uploads directory
      formData.append('files', file);

      const btn = inputEl.nextElementSibling;
      const origText = btn.innerText;
      btn.innerText = '...';
      btn.disabled = true;

      try {
        await api(`/files?base=uploads`, { method: 'POST', body: formData });
        // Set the text input to the path of the newly uploaded file
        document.getElementById(`f_${fieldName}`).value = 'uploads/' + file.name;
      } catch(e) {
        alert('Upload failed: ' + e.message);
      }
      
      btn.innerText = origText;
      btn.disabled = false;
      inputEl.value = ''; // clear the hidden file input
    };

    function editSchemaModal(name = '') {
      const isNew = !name;
      let schema = isNew ?[] : state.schema;
      window._tempSchema = [...schema];
      window._tempColName = name || '';

      let isInitialRender = true;
      function render() {
        if (!isInitialRender && document.getElementById('col-name')) window._tempColName = document.getElementById('col-name').value;
        isInitialRender = false;
        let html = ``;
        if (isNew) html += `<div class="form-field"><input id="col-name" placeholder="" required value="${window._tempColName}"><label>Collection name</label></div>`;

        html += `<div id="schema-fields-container" style="position:relative; display:flex; flex-direction:column; gap:8px;">`;
        html += window._tempSchema.map((f, i) => {
          let baseType = f.type;
          let relTarget = '';
          if (f.type && f.type.startsWith('relation:')) {
            baseType = 'relation';
            relTarget = f.type.split(':')[1];
          }
          let allCols = state.collections.map(c => `<option value="${c.name}" ${c.name === relTarget ? 'selected' : ''}>${c.name}</option>`).join('');

          return `
        <div class="hbox schema-row" data-index="${i}" style="background: var(--card-bg)">
          <div class="handle" style="cursor:grab" onpointerdown="startDrag(event, ${i})">⣿</div>
          <div class="form-field" style="flex:1"><input value="${f.name}" onchange="_tempSchema[${i}].name=this.value" ${f.name === 'id' ? 'disabled' : ''} placeholder=" "><label>Field name</label></div>
          <select onchange="if(this.value==='relation'){ _tempSchema[${i}].type='relation:'+(state.collections[0]?state.collections[0].name:''); } else { _tempSchema[${i}].type=this.value }; renderSchemaModal()" ${f.name === 'id' ? 'disabled' : ''}>
            <option value="string" ${baseType === 'string' ? 'selected' : ''}>String</option>
            <option value="number" ${baseType === 'number' ? 'selected' : ''}>Number</option>
            <option value="bool" ${baseType === 'bool' ? 'selected' : ''}>Bool</option>
            <option value="file" ${baseType === 'file' ? 'selected' : ''}>File</option>
            <option value="relation" ${baseType === 'relation' ? 'selected' : ''}>Relation</option>
          </select>
          ${baseType === 'relation' ? `<select onchange="_tempSchema[${i}].type='relation:'+this.value">${allCols}</select>` : ''}
          <button class="btn danger" style="width: 1.5rem; height: 1.5rem; padding: 0.15rem 0 0 0;" ${f.name === 'id' ? 'disabled' : 'onclick="_tempSchema.splice(' + i + ',1); renderSchemaModal()"'}>✕</button>
        </div>
      `}).join('');
        html += `</div>`;
        html += `<div style="margin-top: 1rem;"><button class="btn" onclick="_tempSchema.push({name:'', type:'string'}); renderSchemaModal()">+ Add field</button></div>
      <div style="margin-top: 1rem;"><button id="modal-confirm-btn" class="btn" onclick="saveSchema('${name}')">Save collection</button> <button class="btn danger" onclick="closeModal()">Cancel</button></div>`;

        document.getElementById('modal-title').innerText = `${isNew ? 'New' : 'Edit'} Collection`;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('modal').style.display = 'flex';
      }
      window.renderSchemaModal = render;
      render();
    }

    async function saveSchema(name) {
      let schema = window._tempSchema.filter(f => f.name.trim() !== '');
      let targetName = name;
      if (!name) {
        targetName = document.getElementById('col-name').value;
        await api(`/collections`, { method: 'POST', body: { name: targetName, schema } });
      } else {
        await api(`/collections/${name}`, { method: 'PUT', body: { schema } });
      }
      closeModal();
      await loadCollections();
      if (targetName) viewCollection(targetName);
    }

    async function saveKey() {
      let perms = {};
      perms.collections = {};
      if (document.getElementById('pk_all_cols').checked) {
        perms.collections["*"] = ["item", "schema"];
      } else {
        document.querySelectorAll('[id^="pk_i_"]').forEach(el => {
          let name = el.id.substring(5);
          if (el.checked || document.getElementById(`pk_s_${name}`).checked) {
            if (!perms.collections[name]) perms.collections[name] =[];
            if (el.checked) perms.collections[name].push("item");
            if (document.getElementById(`pk_s_${name}`).checked) perms.collections[name].push("schema");
          }
        });
      }["routes", "public", "schedules", "settings", "keys", "production", "staging"].forEach(k => { 
        let el = document.getElementById(`pk_${k}`);
        if (el && el.checked) perms[k] = true; 
      });

      let name = document.getElementById('k-name').value;
      await api('/keys', { method: 'POST', body: { name, permissions: perms } });
      closeModal();
      loadKeys();
    }

async function loadAppSettings() {
  document.getElementById('pane-header').style.display = 'none';
  const s = state.settings;

  let mode = 'disabled';
  let bkpD = '', bkpH = '', bkpM = '', bkpS = '';
  if (s.backup_sched && s.backup_sched !== 'Disabled') {
    if (s.backup_sched_meta) {
      try { let meta = JSON.parse(s.backup_sched_meta); mode = meta.mode; bkpD = meta.d || ''; bkpH = meta.h || ''; bkpM = meta.m || ''; bkpS = meta.s || ''; } catch (e) { mode = 'raw'; }
    } else mode = 'raw';

    function formatBytes(bytes, decimals = 2) {
      if (!+bytes) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

    function downloadBackup(filename) {
        window.location.href = '/api/backup/download?file=' + encodeURIComponent(filename);
    }

    async function restoreBackup(filename) {
        if (!confirm(`Are you sure you want to restore from "${filename}"?\n\nThis will OVERWRITE current data and RESTART the server. The admin panel will become unresponsive during the process and then reload.`)) {
            return;
        }

        openModal('Restoring Backup...', '<div class="loader"></div><p style="text-align:center;">Please wait. The server is being restored. This page will reload automatically.</p>');
        document.querySelector('#modal').style.pointerEvents = 'none';

        try {
            await api('/backup/restore', { method: 'POST', body: { file: filename } });
            // The request will likely not complete because the server restarts. We'll just wait and reload.
            setTimeout(() => window.location.reload(), 5000);
        } catch (e) {
            // If the request *does* complete with an error, the server didn't restart.
            alert('Restore failed: ' + e.message);
            document.querySelector('#modal').style.pointerEvents = 'auto';
            closeModal();
        }
    }

    async function deleteBackup(filename) {
        if (confirm(`Are you sure you want to delete the backup file "${filename}"? This action cannot be undone.`)) {
            try {
                await api(`/backup?file=${encodeURIComponent(filename)}`, { method: 'DELETE' });
                loadBackupManager();
            } catch (e) {
                alert('Delete failed: ' + e.message);
            }
        }
    }

    async function renameItem(base, oldPath) {
      let newName = document.getElementById('rename-new-name').value.trim();
      if (!newName) return;
      
      let parts = oldPath.split('/');
      parts.pop();
      parts.push(newName);
      let newPath = parts.join('/');

      if (oldPath === newPath) {
         closeModal();
         return;
      }

      let btn = document.getElementById('modal-confirm-btn');
      btn.disabled = true;
      btn.innerText = "Renaming...";

      try {
        await api(`/files/rename`, { method: 'POST', body: { base: base, old_path: oldPath, new_path: newPath } });
        
        // Evict matching/renamed files from the active editor cache
        for (let b in window.fileEditorCache) {
            if (b === base && window.fileEditorCache[b].path.startsWith(oldPath)) {
                if (window.activeEditor && window.activeEditor.path === window.fileEditorCache[b].path) {
                    window.activeEditor = null;
                    document.getElementById('pane-content').innerHTML = '';
                    document.getElementById('pane-header').innerHTML = '';
                }
                delete window.fileEditorCache[b];
            }
        }

        closeModal();
        loadFiles(base);
      } catch (e) {
        alert("Rename failed: " + e.message);
        btn.disabled = false;
        btn.innerText = "Rename";
      }
    }

          fileTree.addEventListener('drop', async (e) => {
            e.preventDefault();
            document.querySelectorAll('.tree-item.drag-over').forEach(el => el.classList.remove('drag-over'));
            
            if (!e.dataTransfer.files || !e.dataTransfer.files.length) return;
            
            let target = e.target.closest('.tree-item');
            let path = '';
            
            if (target) {
              path = target.getAttribute('data-path') || '';
              if (target.tagName.toLowerCase() === 'li') {
                let lastSlash = path.lastIndexOf('/');
                path = lastSlash >= 0 ? path.substring(0, lastSlash) : '';
              }
            }
            
            await window.uploadFiles(base, path, e.dataTransfer.files);
          });
        }
      }, 0);

      // Auto-open last cached file or default view
      if (base === 'schedules') {
          if (window.fileEditorCache[base]) {
              editFile(base, window.fileEditorCache[base].path);
          } else {
              loadCronJobs();
          }
      } else {
          if (window.fileEditorCache[base]) {
              editFile(base, window.fileEditorCache[base].path);
          }
      }
    }

    const extMap = { 'js': 'javascript', 'ts': 'typescript', 'py': 'python', 'sh': 'bash', 'md': 'markdown' };

async function editFile(base, path) {
    // If opening a new file within the same section, warn if the active file is unsaved
    if (window.activeEditor && window.activeEditor.path !== path) {
        if (window.activeEditor.editor && window.activeEditor.editor.value !== window.activeEditor.originalContent) {
            if (!confirm("You have unsaved changes in the current file. Discard them?")) return;
        }
    }

    if (window.activeEditor && window.activeEditor.element && window.activeEditor.element.parentNode) {
        window.activeEditor.element.parentNode.removeChild(window.activeEditor.element);
    }
    window.activeEditor = null; // Clear the active editor so async/sync event handlers don't use stale data
    
    document.querySelectorAll('.sub-sidebar .sub-item, .sub-sidebar .tree-item').forEach(el => el.classList.remove('active'));
    let activeItem = document.querySelector(`.sub-sidebar .tree-item[data-path="${esc(path)}"]`);
    if (activeItem) activeItem.classList.add('active');

    let apiBtnHtml = '';
    if (path.endsWith('.lua')) {
        apiBtnHtml = `<button class="btn secondary" onclick="showApiDocs()">Lua API Reference</button> `;
    }

    document.getElementById('pane-header').innerHTML = `
        <h2 style="font-family: monospace;">${base}/${path}</h2>
        <div>${apiBtnHtml}<button id="btn-save-file" class="btn" disabled onclick="saveFile('${base}', '${esc(path)}')" title="Ctrl+S">Save changes</button></div>
    `;

    if (path.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
        document.getElementById('pane-content').innerHTML = `<img src="/api/files?base=${base}&path=${path}&raw=true" style="max-width:100%;max-height:80vh">`;
        return;
    }
    
    if (path.match(/\.(mp3|wav|ogg|flac|aac)$/i)) {
        document.getElementById('pane-content').innerHTML = `
          <div style="display:flex; justify-content:center; align-items:center; height:100%;">
            <audio controls src="/api/files?base=${base}&path=${path}&raw=true" style="width: 80%; max-width: 600px;"></audio>
          </div>
        `;
        return;
    }
    
    document.getElementById('pane-content').innerHTML = ''; // Clear non-editor content

    // We are returning to the last file left open in this section, restore from cache
    if (window.fileEditorCache[base] && window.fileEditorCache[base].path === path) {
        let cache = window.fileEditorCache[base];
        document.getElementById('pane-content').appendChild(cache.element);
        window.activeEditor = cache;
        window.editor = cache.editor; // restore globally
        
        const btn = document.getElementById('btn-save-file');
        if (btn) btn.disabled = (cache.editor.value === cache.originalContent);
        return;
    }

    // Otherwise, fetch and instantiate a new editor
    const res = await api(`/files?base=${base}&path=${path}`);
    
    // Normalize line endings to avoid false positive change detections
    let normalizedContent = (res.content || '').replace(/\r\n/g, '\n');
    
    let ext = path.split('.').pop().toLowerCase();
    ext = extMap[ext] || ext;

    let wrapperId = "editor-" + Date.now() + Math.floor(Math.random()*1000);
    let editorWrapper = document.createElement('div');
    editorWrapper.id = wrapperId;
    editorWrapper.style = "height:calc(100% - 1rem); width:100%;";
    document.getElementById('pane-content').appendChild(editorWrapper);

    let edTheme = localStorage.getItem('mogo_editor_theme') || 'auto';
    let edTabSize = parseInt(localStorage.getItem('mogo_editor_tabSize') || '3', 10);
    let edInsertSpaces = localStorage.getItem('mogo_editor_insertSpaces') === 'true';
    let edWordWrap = localStorage.getItem('mogo_editor_wordWrap') !== 'false';
    
    let adminTheme = localStorage.getItem('mogo_theme') || 'auto';
    if (adminTheme === 'auto') {
        adminTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    
    let isDark = edTheme === 'dark' || (edTheme === 'auto' && adminTheme === 'dark');

    // Pre-initialize activeEditor so the sync onUpdate event captures the correct originalContent immediately
    window.activeEditor = {
        base: base,
        path: path,
        element: editorWrapper,
        editor: null,
        originalContent: normalizedContent
    };

    window.editor = createEditor('#' + wrapperId, {
        language: ext,
        value: normalizedContent,
        tabSize: edTabSize,
        insertSpaces: edInsertSpaces,
        wordWrap: edWordWrap,
        onUpdate(code) {
            const btn = document.getElementById('btn-save-file');
            if (btn && window.activeEditor) {
                btn.disabled = (code === window.activeEditor.originalContent);
            }
        }
    });
    
    window.activeEditor.editor = window.editor;

    if (isDark) {
        editorWrapper.classList.add('editor-dark');
    }
    
    // Save to cache for this specific section (base)
    window.fileEditorCache[base] = window.activeEditor;
}

function showApiDocs() {
      document.getElementById('modal-title').innerText = "Lua API Reference";
      document.getElementById('modal-body').innerHTML = `
<div id="api-ref">
    <div>
        <h5>req (Request Table)</h5>
        <ul>
            <li><b>req.method</b>, <b>req.path</b> <i>(string)</i> - HTTP method and path</li>
            <li><b>req.query</b>, <b>req.params</b> <i>(table)</i> - URL query string and parsed route parameters</li>
            <li><b>req.headers</b>, <b>req.cookies</b> <i>(table)</i> - Request headers (lowercase keys) and cookies</li>
            <li><b>req.body</b> <i>(string/table)</i> - Parsed JSON, form data, or raw string</li>
            <li><b>req.ip</b> <i>(string)</i> - Request origin IP</li>
            <li><b>req.files.<i>field</i></b> <i>(table)</i> - Uploaded files containing <b>filename</b>, <b>size</b>, and <b>save(destPath)</b> <i>(function returning boolean)</i></li>
        </ul>
    </div>
    <div>
        <h5>res (Response Table)</h5>
        <ul>
            <li><b>res.status</b> <i>(number)</i> - HTTP status code (default: 200)</li>
            <li><b>res.headers</b> <i>(table)</i> - Response headers</li>
            <li><b>res.body</b> <i>(string/table)</i> - Response body (setting this overrides returned data)</li>
            <li><b>res.cookies.<i>name</i></b> <i>(table/string)</i> - Set cookies. Can be a string (value) or table with fields: <b>value</b>, <b>http_only</b>, <b>secure</b>, <b>max_age</b>, <b>delete</b></li>
            <li><b>res:file(path, <i>[filename]</i>)</b> - Sends a file as a download response</li>
        </ul>
    </div>
    <div>
        <h5>Implicit Returns</h5>
        <p>Instead of manually setting <b>res.body</b>, you can directly return values from your handler:</p>
        <ul>
            <li><i>return "string"</i> - Sends HTML (Content-Type: text/html)</li>
            <li><i>return { key = "value" }</i> - Sends JSON (Content-Type: application/json)</li>
            <li><i>return function() ... end</i> - Runs a post-response function (cleanup, logging, etc.). Can be combined with a string/table return as the second value.</li>
        </ul>
        <p>Any <b>res</b> fields you set (status, headers, cookies) override the returned data.</p>
    </div>
    <div>
        <h5>db (Collections API)</h5>
        <ul>
            <li><b>db.&#60;col&#62;:get(<i>[query]</i>, <i>[limit]</i>, <i>[sort_by]</i>)</b> - Returns array of matching records, ascending by ID by default. Use <i>limit = 0</i> for no limit. Negative limit to reverse order. Relational fields expand automatically into nested tables.</li>
            <li><b>db.&#60;col&#62;:insert(data)</b> - Inserts a row (auto-generates <i>id</i>, <i>created</i>, <i>updated</i>) and returns the new record's id.</li>
            <li><b>db.&#60;col&#62;:update(query, updates)</b> - Updates matching records (set fields to <i>nil</i> to delete them). Returns <i>boolean</i> success.</li>
            <li><b>db.&#60;col&#62;:delete(query)</b> - Deletes matching records. Returns <i>boolean</i> success.</li>
            <li><b>db("SELECT * FROM tbl WHERE id = ?", id)</b> - Execute raw SQL. Returns a table for SELECT/PRAGMA, or <i>boolean, rowsAffected</i> for mutations.</li>
        </ul>
    </div>
    <div>
        <h5>http</h5>
        <ul>
            <li><b>http(method, url, <i>[opts]</i>)</b> - Performs an HTTP request. <b>method</b> is a string (GET, POST, etc.).</li>
        </ul>
        <p><b>opts</b> is a table: <i>{ headers = {key="val"}, body = "data" }</i>. Returns a table: <i>{ status, body, headers }</i>.</p>
    </div>
    <div>
        <h5>log</h5>
        <ul>
            <li><b>log.info(msg)</b>, <b>log.warn(msg)</b>, <b>log.error(msg)</b> - Writes to the system log database.</li>
            <li><b>log:get(<i>[limit]</i>)</b> - Retrieves the latest logs as an array of tables: <i>{id, timestamp, level, origin, script, message}</i>.</li>
        </ul>
    </div>
    <div>
        <h5>Standard Libraries</h5>
        <p>The standard Lua libraries <b>table</b>, <b>string</b>, <b>math</b>, and <b>coroutine</b> are fully available. The <b>os</b> library is restricted (dangerous functions stripped) and <b>io</b> is unavailable by default. Enabling <i>"Allow Unsafe Lua"</i> in the Admin Settings exposes the complete <b>io</b> and <b>debug</b> libraries.</p>
    </div>
</div>

       `;
      document.getElementById('modal').style.display = 'flex';
    }


    async function saveFile(base, path) {
    let content = window.editor ? window.editor.value : document.getElementById('file-editor').value;
    let btn = document.getElementById('btn-save-file');
    btn.innerText = "Saving...";
    btn.disabled = true;
    
    try {
        await api(`/files?base=${base}`, { method: 'POST', body: { path: path, content: content, is_dir: false } });
        
        if (window.activeEditor) window.activeEditor.originalContent = content;
        if (window.fileEditorCache[base] && window.fileEditorCache[base].path === path) {
            window.fileEditorCache[base].originalContent = content;
        }
        btn.innerText = "Save changes";
    } catch (err) {
        alert("Failed to save: " + err.message);
        btn.innerText = "Save changes";
        btn.disabled = false;
    }
}

async function deleteFile(base, path) {
    if (confirm('Delete?')) {
        await api(`/files?base=${base}&path=${path}`, { method: 'DELETE' });
        
        // Ensure cache is destroyed if we delete the file we are currently tracking
        if (window.fileEditorCache[base] && window.fileEditorCache[base].path === path) {
            if (window.activeEditor && window.activeEditor.path === path) {
                if (window.activeEditor.element && window.activeEditor.element.parentNode) {
                    window.activeEditor.element.parentNode.removeChild(window.activeEditor.element);
                }
                window.activeEditor = null;
            }
            delete window.fileEditorCache[base];
        }
        
        loadFiles(base);
    }
}

    async function createFile(base, targetFolder) {
      let type = document.getElementById('nf-type').value;
      
      if (type === 'upload') {
        let fileInput = document.getElementById('nf-file');
        if (!fileInput.files.length) return;
        await uploadFiles(base, targetFolder, fileInput.files);
        closeModal();
        return;
      }

      let name = document.getElementById('nf-name').value;
      let insertSpaces = localStorage.getItem('mogo_editor_insertSpaces') === 'false';
      let tabSize = localStorage.getItem('mogo_editor_tabSize') || '3';
      if (!name) return;

      let isDir = type === 'folder';
      let path = targetFolder ? targetFolder + '/' + name : name;
      
      let content = "";
      if (!isDir) {
        if (base === 'routes') {
          let indent;
          if (insertSpaces) {
            indent = '\t';
          } else {            
            let size = parseInt(tabSize, 10);
            if (isNaN(size)) size = 3;
            indent = ' '.repeat(size);
          }
          let template = "return {\n\tGET = function(req)\n\t\treturn \"<h1>Hello, world!</h1>\"\n\tend\n}";
          content = template.replace(/\t/g, indent);
        } else if (base === 'schedules') {
          content = "log.info(\"Hello, world!\")";
        } else if (type === 'html') {
          content = "<h1>Hello, world!</h1>";
        }
      }

      await api(`/files?base=${base}`, { method: 'POST', body: { path: path, content: content, is_dir: isDir } });
      closeModal();
      loadFiles(base);
    }

    function renderCronsTable() {
      let sorted = sortData([...state.crons]);
      let rows = sorted.map(j => {
        let schedText = j.schedule;
        if (j.schedule_meta) {
          try {
            let meta = JSON.parse(j.schedule_meta);
            if (meta.mode === 'interval') {
              let parts = [];
              if (meta.d) parts.push(meta.d + 'd');
              if (meta.h) parts.push(meta.h + 'h');
              if (meta.m) parts.push(meta.m + 'm');
              if (meta.s) parts.push(meta.s + 's');
              if (parts.length > 0) schedText = "Every " + parts.join(' ');
            }
          } catch (e) { }
        }
        
        let nextRun = j.active 
          ? (j.next_run ? new Date(j.next_run).toLocaleString() : 'Pending') 
          : '<span style="color:var(--muted)">Disabled</span>';

        return `<tr onclick="cronModal(${j.id})">
        <td>${j.name}</td>
        <td>${schedText}</td>
        <td>${j.script_path}</td>
        <td>${j.active ? 'true' : 'false'}</td>

        <td style="text-align:right"><span class="clickable ml-2" onclick="event.stopPropagation(); deleteCron(${j.id})" title="Delete Job">✕</span></td>

    async function saveCron(id) {
      let mode = document.querySelector('input[name="cron_mode"]:checked').value;
      let schedule = document.getElementById('cj-sch')?.value || '0 * * * * *';
      let active = document.getElementById('cj-active').checked;
      let meta = { mode: mode };
      let preventOverlap = document.getElementById('cj-overlap').checked;

      if (mode === 'interval') {
        let d = document.getElementById('ci-day').value;
        let h = document.getElementById('ci-hr').value;
        let m = document.getElementById('ci-min').value;
        let s = document.getElementById('ci-sec').value;

        if (d) meta.d = d;
        if (h) meta.h = h;
        if (m) meta.m = m;
        if (s) meta.s = s;

        schedule = "Interval";
      }

      await api('/crons', {
        method: 'POST', body: {
          id: id,
          name: document.getElementById('cj-name').value,
          schedule: schedule,
          schedule_meta: JSON.stringify(meta),
          script_path: document.getElementById('cj-scr').value,
          active: active,
          prevent_overlap: preventOverlap
        }
      });

      closeModal();
      loadCronJobs();
    }

    async function deleteCron(id) { if (confirm("Delete Job?")) { await api(`/crons?id=${id}`, { method: 'DELETE' }); loadCronJobs(); } }

    // modal utils
    function openModal(title, html) { document.getElementById('modal-title').innerText = title; document.getElementById('modal-body').innerHTML = html; document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('rel-modal').style.display = 'none'; }

    init();
  </script>
</body>

</html>
