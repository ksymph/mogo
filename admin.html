<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mogo Admin</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="prism-code.js"></script>
  <style>.prism-code-editor { height: 100%; }</style>
</head>

<body>

  <div id="login-view">
    <form id="login-form">
      <h2>Mogo Admin</h2>
      <div class="form-field"><input id="api-key" placeholder="" type="password" required autofocus><label>
          API key
        </label></div>
      <button type="submit" class="btn">Access</button>
    </form>
  </div>

  <div id="app-view">
    <div class="sidebar">
      <a href="?tab=collections" class="icon-btn" onclick="handleNavClick(event, 'collections')" title="Collections">
        <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

          <path d="M5 6V12C5 12 5 15 12 15C19 15 19 12 19 12V6" stroke="currentColor" stroke-width="2" />
          <path d="M12 3C19 3 19 6 19 6C19 6 19 9 12 9C5 9 5 6 5 6C5 6 5 3 12 3Z" stroke="currentColor" stroke-width="2" />
        </svg>
      </a>
      
      <a href="?tab=files" class="icon-btn" onclick="handleNavClick(event, 'files')" title="Files">
        <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 18H10.5H14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>

        </svg>
      </a>

      <a href="?tab=logs" class="icon-btn" onclick="handleNavClick(event, 'logs')" title="Logs">
        <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </a>
      <a href="?tab=schedules" class="icon-btn" onclick="handleNavClick(event, 'schedules')" title="Schedules">
        <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 6L12 12L18 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </a>
      <a href="?tab=settings" class="icon-btn" id="nav-settings-btn" onclick="handleNavClick(event, 'settings')" title="Settings">
        <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M19.6224 10.3954L18.5247 7.7448L20 6L18 4L16.2647 5.48295L13.5578 4.36974L12.9353 2H10.981L10.3491 4.40113L7.70441 5.51596L6 4L4 6L5.45337 7.78885L4.3725 10.4463L2 11V13L4.40111 13.6555L5.51575 16.2997L4 18L6 20L7.79116 18.5403L10.397 19.6123L11 22H13L13.6045 19.6132L16.2551 18.5155C16.6969 18.8313 18 20 18 20L20 18L18.5159 16.2494L19.6139 13.598L21.9999 12.9772L22 11L19.6224 10.3954Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <a href="?tab=staging" class="icon-btn" id="nav-staging-btn" onclick="handleNavClick(event, 'staging')" title="Staging">
        <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 20.4V3.6C3 3.26863 3.26863 3 3.6 3H20.4C20.7314 3 21 3.26863 21 3.6V20.4C21 20.7314 20.7314 21 20.4 21H3.6C3.26863 21 3 20.7314 3 20.4Z" stroke="currentColor" stroke-width="2"></path>
          <path d="M6 18L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M12 14V6M12 6L15.5 9.5M12 6L8.5 9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <div id="staging-label" style="display:none; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-weight: bold; flex-grow: 1; align-items: center; justify-content: center; letter-spacing: 4px; color: var(--accent); font-size: 1.2rem; opacity: 0.8; user-select: none;">STAGING</div>
    </div>

    <div id="sub-sidebar" class="sub-sidebar"></div>

    <div id="main-pane" class="main-pane">
      <div class="pane-header" id="pane-header"></div>
      <div class="pane-content" id="pane-content"></div>
      <div id="selection-popup" class="popup-bar">
        <button class="btn danger" onclick="deleteSelected()">Delete Selected</button>
        <button class="btn" onclick="clearSelection()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
  <div id="rel-modal" class="modal-overlay" style="z-index: 2000;">
    <div class="modal" style="max-width: min(640px, 80%);">
      <div class="modal-header">
        <h3 id="rel-modal-title"></h3>
      </div>
      <div id="rel-modal-body" class="modal-body"></div>
    </div>
  </div>

<script>
  function getSystemTheme() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    theme = theme || localStorage.getItem('mogo_theme') || 'auto';

    let effectiveTheme = theme;
    if (effectiveTheme === 'auto') {
      effectiveTheme = getSystemTheme();
    }

    document.documentElement.classList.remove('theme-light', 'theme-dark');
    document.documentElement.classList.add(`theme-${effectiveTheme}`);

    localStorage.setItem('mogo_theme', theme);
  }

  applyTheme();

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (localStorage.getItem('mogo_theme') === 'auto') {
      applyTheme('auto');
    }
  });

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        if (e.target.id === 'rel-modal') {
          closeRelModal();
        } else if (e.target.id === 'modal') {
          closeModal();
        }
      }
    });
    
  let state = {
    tab: '', sub: '', data: [], schema:[], selected: new Set(),
    collections: [], keys: [], crons:[], settings: null,
    environment: 'production',
    sort: { col: 'id', asc: true },
    openFolders: {}
  };

  window.fileEditorCache = {}; // Tracks the last opened file per section: base -> { path, element, editor, originalContent }
  window.activeEditor = null;  // Pointer to the currently active editor instance

  window.handleNavClick = function(e, tab) {
      if (e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
          e.preventDefault();
          
          if (window.activeEditor) {
              let cache = window.activeEditor;
              if (cache.editor.value !== cache.originalContent) {
                  if (!confirm("You have unsaved changes in the active file. Are you sure you want to navigate away?")) {
                      return;
                  }
              }
          }

          nav(tab);
          window.history.pushState({}, '', '?tab=' + tab);
      }
  };

  window.addEventListener('popstate', (e) => {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab') || 'collections';
      nav(tab);
  });

  document.addEventListener('toggle', (e) => {
    if (e.target.tagName === 'DETAILS') {
      const summary = e.target.querySelector('summary.tree-item');
      if (summary) {
        const path = summary.getAttribute('data-path') || '';
        const base = summary.getAttribute('data-base');
        if (state.tab === 'files') {
          let stateKey = `files_${base}`;
          if (!state.openFolders[stateKey]) state.openFolders[stateKey] = new Set();
          if (e.target.open) state.openFolders[stateKey].add(path);
          else state.openFolders[stateKey].delete(path);
        } else if (state.tab && state.openFolders[state.tab]) {
          if (e.target.open) state.openFolders[state.tab].add(path);
          else state.openFolders[state.tab].delete(path);
        }
      }
    }
  }, true);

  function handleSort(col) {
      if (state.sort.col === col) {
        state.sort.asc = !state.sort.asc;
      } else {
        state.sort.col = col;
        state.sort.asc = true;
      }
      if (state.tab === 'collections') renderCollectionTable();
      if (state.tab === 'settings' && state.sub === 'keys') renderKeysTable();
      if (state.tab === 'files') renderCronsTable();
    }

    function sortData(arr) {
      let { col, asc } = state.sort;
      return arr.sort((a, b) => {
        let va = a[col];
        let vb = b[col];
        if (va === vb) return 0;
        if (va == null) return asc ? -1 : 1;
        if (vb == null) return asc ? 1 : -1;
        if (typeof va === 'string' && typeof vb === 'string') {
          return asc ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        return asc ? (va < vb ? -1 : 1) : (va > vb ? -1 : 1);
      });
    }

    function th(col, label) {
      let arrow = state.sort.col === col ? (state.sort.asc ? ' ▲' : ' ▼') : '';
      return `<th onclick="handleSort('${col}')" class="sortable-header">${label || col}${arrow}</th>`;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('modal').style.display === 'flex') {
        closeModal();
      }
      if (e.key === 'Enter' && document.getElementById('modal').style.display === 'flex') {
        if (e.target.tagName === 'TEXTAREA') return; 
        const confirmBtn = document.getElementById('modal-confirm-btn');
        if (confirmBtn && !confirmBtn.disabled) {
          e.preventDefault();
          confirmBtn.click();
        }
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        const saveBtn = document.getElementById('btn-save-file');
        if (saveBtn && !saveBtn.disabled) {
          e.preventDefault();
          saveBtn.click();
        } else if (saveBtn && saveBtn.disabled) {
          e.preventDefault(); 
        }
      }
    });

    function esc(s) { return s.replace(/'/g, "\\'"); }

    async function api(path, opts = {}) {
      opts.headers = opts.headers || {};
      if (!(opts.body instanceof FormData)) {
        opts.headers["Content-Type"] = "application/json";
        if (opts.body && typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
      }
      
      const res = await fetch(`/api${path}`, opts);
      if (res.status === 401) { showLogin(); throw new Error("Unauthorized"); }
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    // ---------- Drag and Drop List Reordering logic ----------
    let dragInfo = null;
    window.startDrag = function (e, index) {
      if (e.button !== 0) return;
      e.preventDefault();

      const container = document.getElementById('schema-fields-container');
      const row = e.target.closest('.schema-row');
      const rect = row.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();

      const placeholder = document.createElement('div');
      placeholder.className = 'hbox schema-row placeholder';
      placeholder.style.height = rect.height + 'px';
      placeholder.style.border = '2px dashed var(--bg-3)';
      placeholder.style.borderRadius = '4px';
      placeholder.style.boxSizing = 'border-box';

      row.style.position = 'absolute';
      row.style.zIndex = '1000';
      row.style.width = rect.width + 'px';
      row.style.top = (rect.top - containerRect.top) + 'px';
      row.style.left = (rect.left - containerRect.left) + 'px';
      row.style.boxShadow = 'var(--shadow)';
      row.style.background = 'var(--card-bg)'; 

      container.insertBefore(placeholder, row.nextSibling);

      const startY = e.clientY;
      const startTop = rect.top - containerRect.top;

      dragInfo = { row, placeholder, container, startY, startTop, index };

      document.addEventListener('pointermove', window.onDragMove);
      document.addEventListener('pointerup', window.onDragEnd);
    };

    window.onDragMove = function (e) {
      if (!dragInfo) return;
      e.preventDefault();
      const { row, placeholder, container, startY, startTop } = dragInfo;

      const dy = e.clientY - startY;
      row.style.top = (startTop + dy) + 'px';

      const siblings = Array.from(container.children).filter(c => c !== row && c !== placeholder && c.classList.contains('schema-row'));
      const rowCenter = e.clientY;

      let inserted = false;
      for (let i = 0; i < siblings.length; i++) {
        const rect = siblings[i].getBoundingClientRect();
        if (rowCenter < rect.top + rect.height / 2) {
          container.insertBefore(placeholder, siblings[i]);
          inserted = true;
          break;
        }
      }
      if (!inserted) {
        container.appendChild(placeholder);
      }
    };

    window.onDragEnd = function (e) {
      if (!dragInfo) return;
      document.removeEventListener('pointermove', window.onDragMove);
      document.removeEventListener('pointerup', window.onDragEnd);

      const { row, placeholder, container, index } = dragInfo;

      const siblingsAndPlaceholder = Array.from(container.children).filter(c => c.classList.contains('schema-row') && c !== row);
      const newIndex = siblingsAndPlaceholder.indexOf(placeholder);

      row.style.position = '';
      row.style.zIndex = '';
      row.style.width = '';
      row.style.top = '';
      row.style.left = '';
      row.style.boxShadow = '';
      row.style.background = '';

      container.insertBefore(row, placeholder);
      placeholder.remove();

      if (newIndex !== -1 && newIndex !== index) {
        const item = window._tempSchema.splice(index, 1)[0];
        window._tempSchema.splice(newIndex, 0, item);
        renderSchemaModal();
      }

      dragInfo = null;
    };


    // ---------- logs ----------
    async function loadLogs(level = '', offset = 0) {
      document.getElementById('pane-header').innerHTML = `
        <h2>Logs</h2>
        <div style="display:flex; gap: 8px;">
          <select id="log-level-filter" onchange="loadLogs(this.value, 0)">
            <option value="">All Levels</option>
            <option value="info" ${level === 'info' ? 'selected' : ''}>Info</option>
            <option value="warn" ${level === 'warn' ? 'selected' : ''}>Warn</option>
            <option value="error" ${level === 'error' ? 'selected' : ''}>Error</option>
          </select>
          <button class="btn danger" onclick="clearLogs()">Clear All Logs</button>
        </div>
      `;

      const res = await api(`/logs?level=${level}`);
      const logs = res.logs ||[];
      state.logs = logs; 

      let html = `<table class="data-table"><thead><tr>
        <th style="width: 50px;">ID</th>
        <th style="width: 180px;">Timestamp</th>
        <th style="width: 80px;">Level</th>
        <th style="width: 140px;">Origin</th>
        <th style="width: 180px;">Script</th>
        <th>Message</th>
      </tr></thead><tbody>`;

      if (logs.length === 0) {
        html += `<tr style="box-shadow: none;"><td colspan="6" style="text-align:center; padding: 2rem; cursor: default;">No logs found.</td></tr>`;
      } else {
        logs.forEach((l, idx) => {
          let badgeColor = l.level === 'error' ? 'var(--danger)' : (l.level === 'warn' ? 'var(--accent)' : 'var(--success, #10b981)');
          
          let shortMsg = l.message ? (l.message.length > 100 ? l.message.substring(0, 100) + '...' : l.message) : '';
          shortMsg = shortMsg.replace(/</g, "&lt;");
          
          shortMsg = shortMsg.replace(/^\[([^\]]+)\]/, '<span style="color:var(--muted); margin-right:4px;">[$1]</span>');

          html += `<tr style="cursor:pointer" onclick="viewLogDetail(${idx})">
            <td>${l.id}</td>
            <td style="white-space:nowrap">${new Date(l.timestamp).toLocaleString()}</td>
            <td><span style="color:${badgeColor}; font-weight:bold;">${l.level.toUpperCase()}</span></td>
            <td><code>${l.origin || ''}</code></td>
            <td style="max-width:180px; overflow:hidden; text-overflow:ellipsis;">${l.script_path || ''}</td>
            <td style="max-width:300px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${shortMsg}</td>
          </tr>`;
        });
      }
      html += `</tbody></table>`;


      document.getElementById('pane-content').innerHTML = html;
    }

    async function clearLogs() {
      if (!confirm("Are you sure you want to delete ALL logs? This cannot be undone.")) return;
      await api('/logs', { method: 'DELETE' });
      loadLogs(document.getElementById('log-level-filter').value, 0);
    }

    function viewLogDetail(idx) {
      let l = state.logs[idx];
      document.getElementById('modal-title').innerText = `Log #${l.id}`;
      document.getElementById('modal-body').innerHTML = `
        <div class="log">
        <span><b>Timestamp</b>: ${new Date(l.timestamp).toLocaleString()}</span>
        <span><b>Level</b>:       ${l.level}</span>
        <span><b>Origin</b>:      ${l.origin}</span>
        <span><b>Script</b>:      ${l.script_path}</span>
        <hr>
        <div>${l.message ? l.message.replace(/</g, "&lt;") : ''}</div>
        </div>
      `;
      document.getElementById('modal').style.display = 'flex';
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const autoKey = params.get('key');
      if (autoKey) {
        window.history.replaceState({}, document.title, window.location.pathname);
        try { await api('/auth/login', { method: 'POST', body: { api_key: autoKey } }); }
        catch (e) { }
      }

      try {
        const authRes = await api('/auth/check');
        state.environment = authRes.environment;
        if (state.environment === 'production') {
          state.settings = await api('/settings');
        } else {
          state.settings = {};
        }
        showApp();
      } catch { showLogin(); }
    }

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/auth/login', { method: 'POST', body: { api_key: document.getElementById('api-key').value } });
        const authRes = await api('/auth/check');
        state.environment = authRes.environment;
        if (state.environment === 'production') {
          state.settings = await api('/settings');
        } else {
          state.settings = {};
        }
        showApp();
      } catch (e) { alert("Invalid API Key"); }
    };

    function showLogin() { document.getElementById('app-view').style.display = 'none'; document.getElementById('login-view').style.display = 'flex'; }
    
    function showApp() { 
      document.getElementById('login-view').style.display = 'none'; 
      document.getElementById('app-view').style.display = 'flex'; 
      
      if (state.environment === 'staging') {
        document.getElementById('nav-staging-btn').style.display = 'none';
        document.getElementById('nav-settings-btn').style.display = 'none';
        document.getElementById('staging-label').style.display = 'flex';
      } else {
        document.getElementById('nav-staging-btn').style.display = (state.settings && state.settings.staging_enabled) ? 'flex' : 'none';
        document.getElementById('nav-settings-btn').style.display = 'flex';
        document.getElementById('staging-label').style.display = 'none';
      }

      const params = new URLSearchParams(window.location.search);
      const initialTab = params.get('tab') || 'collections';
      nav(initialTab); 
    }

    function nav(tab) {
      if (['routes', 'middleware', 'public'].includes(tab)) tab = 'files';

      if (window.activeEditor && window.activeEditor.element && window.activeEditor.element.parentNode) {
          window.activeEditor.element.parentNode.removeChild(window.activeEditor.element);
      }
      window.activeEditor = null; 

      state.tab = tab; state.sub = ''; state.search = '';
      state.sort = { col: 'id', asc: true };
      document.querySelectorAll('.icon-btn').forEach(e => e.classList.remove('active'));

      let iconBtn = document.querySelector(`.icon-btn[href="?tab=${tab}"]`);
      if (iconBtn) iconBtn.classList.add('active');

      document.getElementById('sub-sidebar').style.display =['collections', 'files', 'settings'].includes(tab) ? 'flex' : 'none';
      document.getElementById('pane-header').style.display = 'flex';
      document.getElementById('pane-header').innerHTML = '';
      document.getElementById('pane-content').innerHTML = '';
      document.getElementById('selection-popup').classList.remove('show');

      if (tab === 'collections') loadCollections();
      if (tab === 'settings') loadSettings('app');
      if (tab === 'staging') loadStaging();
      if (tab === 'logs') loadLogs();
      if (tab === 'schedules') loadCronJobs();
      if (tab === 'files') loadAllFiles();
    }

    // ---------- collections ----------
    async function loadCollections() {
      const cols = await api('/collections');
      state.collections = cols;
      let html = cols.map(c => `<div class="sub-item ${c.name === state.sub ? 'active' : ''}" onclick="viewCollection('${c.name}')">${c.name}</div>`).join('');
      html += `<button class="btn btn-block" onclick="editSchemaModal()">+ New Collection</button>`;
      document.getElementById('sub-sidebar').innerHTML = html;

      if (cols.length > 0 && !state.sub) {
        viewCollection(cols[0].name);
      } else if (cols.length === 0) {
        document.getElementById('pane-header').innerHTML = '<h2>Collections</h2>';
        document.getElementById('pane-content').innerHTML = '<p style="padding:1.5rem">No collections found.</p>';
      }
    }
    
    async function deleteSingleItem(id) {
      if (confirm("Are you sure you want to delete this item?")) {
        await api(`/collections/${state.sub}?ids=${id}`, { method: 'DELETE' });
        closeModal();
        viewCollection(state.sub);
      }
    }

    async function viewCollection(name) {
      state.sub = name;
      state.sort = { col: 'id', asc: true };
      document.querySelectorAll('.sub-sidebar .sub-item').forEach(el => el.classList.remove('active'));
      const subItem = Array.from(document.querySelectorAll('.sub-sidebar .sub-item')).find(el => el.innerText === name);
      if (subItem) subItem.classList.add('active');

      const col = state.collections.find(c => c.name === name);
      if (!col) return;

      state.schema = col.schema ||[];
      const res = await api(`/collections/${name}?search=${encodeURIComponent(state.search || '')}`);
      state.data = res.items ||[];

      state.selected.clear();
      renderCollectionTable();
    }

function renderCollectionTable() {
      const cols =['id', ...state.schema.map(s => s.name), 'created', 'updated'];
      document.getElementById('pane-header').innerHTML = `
      <h2>${state.sub}</h2>
      <div class="hbox">
        <div class="form-field" style="margin:0; width:250px"><input type="text" id="coll-search" placeholder=" " value="${state.search || ''}" oninput="debounceSearch(this.value)"><label>Search (or field:value)...</label></div>
        <button class="btn danger" onclick="deleteCollection('${state.sub}')">Delete Collection</button>
        <button class="btn" onclick="editSchemaModal('${state.sub}')">Edit Schema</button>
        <button class="btn" onclick="itemModal()">+ Item</button>
      </div>
    `;
      let ths = cols.map(c => th(c, c)).join('');

      let sortedData = sortData([...state.data]);

      let rows = sortedData.map(d => `
      <tr onclick="itemModal('${d.id}')">
        <td onclick="event.stopPropagation()"><input type="checkbox" onchange="toggleSelect('${d.id}', this.checked)" ${state.selected.has(String(d.id)) ? 'checked' : ''}></td>
        ${cols.map(c => {
        let val = d[c];
        if (c === 'created' || c === 'updated') {
          if (val) {
            let numVal = Number(val);
            let ms = numVal > 1e11 ? numVal : numVal * 1000;
            return `<td>${new Date(ms).toLocaleString()}</td>`;
          }
          return `<td></td>`;
        }
        let sc = state.schema.find(s => s.name === c);
        if (sc && sc.type === 'bool') {
          if (val === undefined || val === null || val === '') return `<td></td>`;
          return `<td>${(val === true || val === 1 || val === 'true') ? 'true' : 'false'}</td>`;
        }
        
        if (sc && state.collections.some(col => col.name === sc.type)) {
          if (val === undefined || val === null || val === '') return `<td></td>`;
          if (typeof val === 'object' && val !== null) {
            return `<td>${val.name || val.title || val.id || JSON.stringify(val)}</td>`;
          }
        }
        return `<td>${val !== undefined && val !== null ? val : ''}</td>`;
      }).join('')}
      </tr>
    `).join('');

      document.getElementById('pane-content').innerHTML = `
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead><tr><th style="width:30px"><input type="checkbox" onchange="toggleSelectAll(this.checked)"></th>${ths}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
    }

    function toggleSelect(id, checked) {
      let strId = String(id);
      checked ? state.selected.add(strId) : state.selected.delete(strId);
      document.getElementById('selection-popup').classList.toggle('show', state.selected.size > 0);
    }

    function clearSelection() {
      state.selected.clear();
      document.getElementById('selection-popup').classList.remove('show');
      renderCollectionTable();
    }

    function toggleSelectAll(checked) {
      state.selected.clear();
      if (checked) {
        state.data.forEach(d => state.selected.add(String(d.id)));
      }
      document.getElementById('selection-popup').classList.toggle('show', state.selected.size > 0);
      renderCollectionTable();
    }

    let searchTimeout;
    function debounceSearch(val) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        state.search = val;
        viewCollection(state.sub);
        setTimeout(() => {
          let inp = document.getElementById('coll-search');
          if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        }, 50);
      }, 300);
    }

    async function deleteSelected() {
      await api(`/collections/${state.sub}?ids=${Array.from(state.selected).join(',')}`, { method: 'DELETE' });
      clearSelection();
      viewCollection(state.sub);
    }

    async function deleteCollection(name) {
      if (confirm(`Are you sure you want to delete the collection '${name}' and all its data? This action cannot be undone.`)) {
        await api(`/collections/${name}`, { method: 'DELETE' });
        state.sub = '';
        document.getElementById('pane-header').innerHTML = '';
        document.getElementById('pane-content').innerHTML = '';
        loadCollections();
      }
    }

function itemModal(id = null) {
      const item = id ? state.data.find(d => d.id == id) : {};
      let html = ``;

      if (id) {
        html += `<div class="form-field"><input type="text" id="f_id" value="${item.id !== undefined ? item.id : ''}" placeholder=" " oninput="window.checkItemID(${id})"><label>id</label></div>`;
        html += `<div id="id-error" style="color:var(--danger);font-size:0.85rem;display:none;">ID already exists</div>`;
      }

      state.schema.forEach(f => {
        if (f.name === 'id' || f.name === 'created' || f.name === 'updated') return;
        let val = item[f.name] !== undefined && item[f.name] !== null ? item[f.name] : '';

        if (f.type === 'bool') {
          html += `<div class="form-check"><label><span>${f.name}</span> <input type="checkbox" id="f_${f.name}" ${val === true || val === 1 || val === 'true' ? 'checked' : ''}></label></div>`;
        } else if (f.type === 'number') {
          html += `<div class="form-field"><input type="number" step="any" id="f_${f.name}" value="${val}" placeholder=" "><label>${f.name}</label></div>`;
        } else if (f.type === 'file') {
          html += `
            <div class="hbox">
              <div class="form-field" style="flex:1">
                <input type="text" id="f_${f.name}" value="${val}" placeholder="">
                <label>${f.name}</label>
              </div>
              <input type="file" id="file_picker_${f.name}" style="display:none" onchange="uploadCollectionFile('${f.name}', this)">
              <button class="btn secondary" onclick="document.getElementById('file_picker_${f.name}').click()">Upload</button>
            </div>
          `;
        } else if (f.type === 'json') {
          let escapedVal = String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          html += `
            <div class="form-field">
              <textarea id="f_${f.name}" placeholder="{}" style="font-family: monospace; min-height: 4em;">${escapedVal}</textarea>
              <label>${f.name} (JSON)</label>
            </div>
          `;
        } else if (state.collections.some(c => c.name === f.type)) {
          let target = f.type; 
          
          let displayVal = val;
          if (typeof val === 'object' && val !== null) {
              displayVal = val.id;
          }
          
          html += `
            <div class="hbox">
              <div class="form-field" style="flex:1">
                <input type="text" id="f_${f.name}" value="${displayVal !== undefined && displayVal !== null ? displayVal : ''}" placeholder="" readonly>
                <label>${f.name}</label>
              </div>
              <button class="btn secondary" onclick="openRelSelect('${f.name}', '${target}')">Select: ${target}</button>
              <button class="btn danger" style="padding: 0 0.75rem;" onclick="document.getElementById('f_${f.name}').value=''" title="Clear">✕</button>
            </div>
          `;
        } else {
          let escapedVal = String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          html += `<div class="form-field"><textarea id="f_${f.name}" placeholder="">${escapedVal}</textarea><label>${f.name}</label></div>`;
        }
      });

      if (id) {
        let cVal = item['created'] !== undefined && item['created'] !== null ? item['created'] : '';
        let uVal = item['updated'] !== undefined && item['updated'] !== null ? item['updated'] : '';
        html += `<div class="form-field"><input type="text" value="${cVal}" readonly placeholder=" "><label>created</label></div>`;
        html += `<div class="form-field"><input type="text" value="${uVal}" readonly placeholder=" "><label>updated</label></div>`;
      }

      let idArg = id ? `'${id}'` : 'null';
      let buttonsHtml = `<div class="hbox">
        <button id="modal-confirm-btn" class="btn" onclick="saveItem(${idArg})">Save</button>`;
      
      if (id) {
        buttonsHtml += `<button class="btn danger" style="background-color: var(--danger)" onclick="deleteSingleItem('${id}')">Delete</button>`;
      }
      
      buttonsHtml += `<button class="btn danger" onclick="closeModal()">Cancel</button></div>`;

document.getElementById('modal-title').innerText = `${id ? 'Edit' : 'New'} Item`;
      document.getElementById('modal-body').innerHTML = html + buttonsHtml;
      document.getElementById('modal').style.display = 'flex';
      setTimeout(() => {
        let firstInput = document.querySelector('#modal-body input:not([readonly]), #modal-body textarea:not([readonly])');
        if (firstInput) firstInput.focus();
      }, 50);
    }

    window.checkItemID = function(origID) {
      let el = document.getElementById('f_id');
      let err = document.getElementById('id-error');
      let btn = document.getElementById('modal-confirm-btn');
      let newID = el.value.trim();
      if (newID !== '' && newID != origID && state.data.some(d => d.id == newID)) {
        err.style.display = 'block';
        el.style.boxShadow = 'inset 0 0 0 2px var(--danger)';
        btn.disabled = true;
      } else {
        err.style.display = 'none';
        el.style.boxShadow = '';
        btn.disabled = false;
      }
    };

    async function saveItem(id) {
      let payload = {};
      let hasError = false;

      if (id) {
        let idEl = document.getElementById('f_id');
        if (idEl) {
          let newID = idEl.value.trim();
          if (newID !== '' && newID != id && state.data.some(d => d.id == newID)) {
            document.getElementById('id-error').style.display = 'block';
            idEl.style.boxShadow = 'inset 0 0 0 2px var(--danger)';
            document.getElementById('modal-confirm-btn').disabled = true;
            return;
          }
          document.getElementById('id-error').style.display = 'none';
          idEl.style.boxShadow = '';
          payload.id = newID;
        }
      }

      state.schema.forEach(f => {
        if (f.name === 'id' || f.name === 'created' || f.name === 'updated') return;
        let el = document.getElementById(`f_${f.name}`);
        if (el) {
          if (f.type === 'bool') {
            payload[f.name] = el.checked;
          } else if (f.type === 'number') {
            payload[f.name] = el.value !== '' ? parseFloat(el.value) : null;
          } else if (f.type === 'json') {
            let v = el.value.trim();
            if (v !== '') {
              try {
                JSON.parse(v);
              } catch (e) {
                alert(`Invalid JSON syntax in field '${f.name}': \n\n` + e.message);
                hasError = true;
              }
            }
            payload[f.name] = v; 
          } else if (state.collections.some(c => c.name === f.type)) {
            let v = parseInt(el.value, 10);
            payload[f.name] = isNaN(v) ? null : v;
          } else {
            payload[f.name] = el.value;
          }
        }
      });
      
      if (hasError) return; 
      
      await api(`/collections/${state.sub}${id ? '/' + id : ''}`, { method: id ? 'PUT' : 'POST', body: payload });
      closeModal();
      viewCollection(state.sub);
    }
    
    window.uploadCollectionFile = async function(fieldName, inputEl) {
      if (!inputEl.files || !inputEl.files.length) return;
      const file = inputEl.files[0];
      const formData = new FormData();
      formData.append('path', ''); 
      formData.append('files', file);

      const btn = inputEl.nextElementSibling;
      const origText = btn.innerText;
      btn.innerText = '...';
      btn.disabled = true;

      try {
        await api(`/files?base=uploads`, { method: 'POST', body: formData });
        document.getElementById(`f_${fieldName}`).value = 'uploads/' + file.name;
      } catch(e) {
        alert('Upload failed: ' + e.message);
      }
      
      btn.innerText = origText;
      btn.disabled = false;
      inputEl.value = ''; 
    };

    async function editSchemaModal(name = '') {
      const isNew = !name;
      const existingCol = name ? state.collections.find(c => c.name === name) : null;
      const schema = isNew ? [] : state.schema;

      let middlewareFiles = null;
      try {
          const files = await api('/files?base=middleware');
          middlewareFiles = files.filter(f => !f.is_dir).map(f => f.path);
      } catch (e) { }

      const allCollectionNames = new Set(state.collections.map(c => c.name));

      window._tempSchema = schema.map(f => {
        if (allCollectionNames.has(f.type)) {
          return { ...f, type: `relation:${f.type}` };
        }
        return { ...f };
      });

      window._tempColName = name || '';
      window._tempMiddlewareScript = existingCol ? (existingCol.middleware_script || '') : '';

      let isInitialRender = true;
      function render() {
        if (!isInitialRender && document.getElementById('col-name')) window._tempColName = document.getElementById('col-name').value;
        if (!isInitialRender && document.getElementById('col-middleware')) window._tempMiddlewareScript = document.getElementById('col-middleware').value;
        isInitialRender = false;
        
        let html = ``;
        html += `<div class="form-field"><input id="col-name" placeholder="" required value="${window._tempColName}"><label>Collection name</label></div>`;

        html += `<div id="schema-fields-container" style="position:relative; display:flex; flex-direction:column; gap:8px;">`;
        html += window._tempSchema.map((f, i) => {
          let baseType = f.type;
          let relTarget = '';
          if (f.type && f.type.startsWith('relation:')) {
            baseType = 'relation';
            relTarget = f.type.split(':')[1];
          }
          let allCols = state.collections.map(c => `<option value="${c.name}" ${c.name === relTarget ? 'selected' : ''}>${c.name}</option>`).join('');

          return `
        <div class="hbox schema-row" data-index="${i}" style="background: var(--card-bg)">
          <div class="handle" style="cursor:grab" onpointerdown="startDrag(event, ${i})">⣿</div>
          <div class="form-field" style="flex:1"><input value="${f.name}" onchange="_tempSchema[${i}].name=this.value" ${f.name === 'id' ? 'disabled' : ''} placeholder=" "><label>Field name</label></div>
          ${baseType === 'relation' ? `<select onchange="_tempSchema[${i}].type='relation:'+this.value">${allCols}</select>` : ''}
          <select onchange="if(this.value==='relation'){ const firstCol = state.collections[0]; _tempSchema[${i}].type = firstCol ? 'relation:' + firstCol.name : 'relation:'; } else { _tempSchema[${i}].type=this.value }; renderSchemaModal()" ${f.name === 'id' ? 'disabled' : ''}>
            <option value="string" ${baseType === 'string' ? 'selected' : ''}>String</option>
            <option value="number" ${baseType === 'number' ? 'selected' : ''}>Number</option>
            <option value="bool" ${baseType === 'bool' ? 'selected' : ''}>Bool</option>
            <option value="file" ${baseType === 'file' ? 'selected' : ''}>File</option>
            <option value="json" ${baseType === 'json' ? 'selected' : ''}>JSON</option>
            <option value="relation" ${baseType === 'relation' ? 'selected' : ''}>Relation</option>
          </select>
          <button class="btn danger" style="width: 1.5rem; height: 1.5rem; padding: 0.15rem 0 0 0;" ${f.name === 'id' ? 'disabled' : 'onclick="_tempSchema.splice(' + i + ',1); renderSchemaModal()"'}>✕</button>
        </div>
      `}).join('');
        html += `</div>`;
        html += `<div style="margin-top: 1rem;"><button class="btn" onclick="_tempSchema.push({name:'', type:'string'}); renderSchemaModal()">+ Add field</button></div>`;

        let mwWarning = '';
        if (existingCol && existingCol.middleware_script) {
            mwWarning = `<small style="color:var(--muted); font-size:0.8em; display:block; margin-top:2px;">Note: Due to system constraints, a script cannot be unassigned once attached, only swapped for another script.</small>`;
        }

        let mwHtml = '';
        if (middlewareFiles !== null) {
            let hasTruthyExisting = existingCol && existingCol.middleware_script;
            mwHtml = `
            <div class="form-field" style="margin-top: 1.5rem;">
                <select id="col-middleware" onchange="window._tempMiddlewareScript = this.value">
                    ${ !hasTruthyExisting ? '<option value="">-- None --</option>' : '' }
                    ${ middlewareFiles.map(f => `<option value="${f}" ${window._tempMiddlewareScript === f ? 'selected' : ''}>${f}</option>`).join('') }
                </select>
                <label class="always-float">Middleware Script (Optional)</label>
            </div>
            ${mwWarning}
            `;
        } else {
            mwHtml = `
            <div class="form-field" style="margin-top: 1.5rem;">
                <input id="col-middleware" value="${window._tempMiddlewareScript}" onchange="window._tempMiddlewareScript = this.value" placeholder=" ">
                <label>Middleware Script (Optional)</label>
            </div>
            ${mwWarning}
            `;
        }
        
        html += mwHtml;

        html += `<div style="margin-top: 1.5rem;"><button id="modal-confirm-btn" class="btn" onclick="saveSchema('${name}')">Save collection</button> <button class="btn danger" onclick="closeModal()">Cancel</button></div>`;

        document.getElementById('modal-title').innerText = `${isNew ? 'New' : 'Edit'} Collection`;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('modal').style.display = 'flex';
      }
      window.renderSchemaModal = render;
      render();
    }

    async function saveSchema(name) {
      const schemaForBackend = window._tempSchema
        .filter(f => f.name.trim() !== '')
        .map(f => {
          const newField = { ...f }; 
          if (newField.type && newField.type.startsWith('relation:')) {
            newField.type = newField.type.split(':')[1];
          }
          return newField;
        });

      const middlewareScript = (document.getElementById('col-middleware') ? document.getElementById('col-middleware') : window._tempMiddlewareScript) || "";
      const middlewareScriptVal = typeof middlewareScript === 'string' ? middlewareScript : middlewareScript.value;

      let targetName = document.getElementById('col-name').value;
      if (!targetName) {
        return alert('Collection name cannot be empty.');
      }

      if (!name) {
        await api(`/collections`, { method: 'POST', body: { name: targetName, schema: schemaForBackend, middleware_script: middlewareScriptVal } });
      } else {
        await api(`/collections/${name}`, { method: 'PUT', body: { name: targetName, schema: schemaForBackend, middleware_script: middlewareScriptVal } });
      }
      closeModal();
      await loadCollections();
      if (targetName) viewCollection(targetName);
    }

    async function saveKey() {
      let perms = {};
      perms.collections = {};
      if (document.getElementById('pk_all_cols').checked) {
        perms.collections["*"] = ["item", "schema"];
      } else {
        document.querySelectorAll('[id^="pk_i_"]').forEach(el => {
          let name = el.id.substring(5);
          if (el.checked || document.getElementById(`pk_s_${name}`).checked) {
            if (!perms.collections[name]) perms.collections[name] =[];
            if (el.checked) perms.collections[name].push("item");
            if (document.getElementById(`pk_s_${name}`).checked) perms.collections[name].push("schema");
          }
        });
      }
      ["files", "routes", "public", "schedules", "settings", "keys", "production", "staging"].forEach(k => { 
        let el = document.getElementById(`pk_${k}`);
        if (el && el.checked) perms[k] = true; 
      });

      let name = document.getElementById('k-name').value;
      await api('/keys', { method: 'POST', body: { name, permissions: perms } });
      closeModal();
      loadKeys();
    }

    async function saveSettings() {
      let mode = document.querySelector('input[name="bkp_cron_mode"]:checked').value;
      let schedule = 'Disabled';
      let meta = { mode: mode };

      if (mode === 'raw') {
        schedule = document.getElementById('s-bkp-sch').value;
      } else if (mode === 'interval') {
        let d = document.getElementById('s-bkp-d').value;
        let h = document.getElementById('s-bkp-h').value;
        let m = document.getElementById('s-bkp-m').value;
        let s = document.getElementById('s-bkp-s').value;
        if (d) meta.d = d;
        if (h) meta.h = h;
        if (m) meta.m = m;
        if (s) meta.s = s;
        schedule = "Interval";
      }

      let payload = {
        port: parseInt(document.getElementById('s-port').value, 10) || 8080,
        staging_enabled: document.getElementById('s-staging-enabled').checked,
        staging_port: parseInt(document.getElementById('s-staging-port').value, 10) || 8090,
        backup_dest_dir: document.getElementById('s-bkp-dir').value,
        backup_type: document.getElementById('s-bkp-type').value,
        backup_retention: parseInt(document.getElementById('s-bkp-retention').value, 10),
        backup_sched: schedule,
        backup_sched_meta: JSON.stringify(meta),
        allowed_origins: document.getElementById('s-origins').value,
        rate_limit_rps: parseFloat(document.getElementById('s-pub-rps').value),
        rate_limit_burst: parseInt(document.getElementById('s-pub-burst').value, 10),
        admin_max_retries: parseInt(document.getElementById('s-adm-retries').value, 10),
        log_retention_days: parseInt(document.getElementById('s-log-ret').value, 10),
        max_log_count_per_req: parseInt(document.getElementById('s-log-max').value, 10) || 100,
        max_log_count: parseInt(document.getElementById('s-log-max-total').value, 10) || 0,
        unsafe_lua: document.getElementById('set_unsafe_lua').checked,
      };
      
      // Preserve current paths and custom dirs if they exist in state 
      if (state.settings) {
          payload.routes_path = state.settings.routes_path;
          payload.middleware_path = state.settings.middleware_path;
          payload.public_path = state.settings.public_path;
          payload.scripts_path = state.settings.scripts_path;
          payload.uploads_path = state.settings.uploads_path;
          payload.custom_dirs = state.settings.custom_dirs;
      }

      await api('/settings', { method: 'POST', body: payload });
      state.settings = payload;
      
      if (state.environment !== 'staging') {
          document.getElementById('nav-staging-btn').style.display = payload.staging_enabled ? 'flex' : 'none';
      }
      
      document.getElementById('btn-save-settings').disabled = true;
    }

    function formatBytes(bytes, decimals = 2) {
      if (!+bytes) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

        document.getElementById('pane-header').innerHTML = `
            <h2>Backup Manager</h2>

        `;
        document.getElementById('pane-content').innerHTML = `<div class="loader"></div>`;

        try {
            const backups = await api('/backup');
            if (backups.length === 0) {
                document.getElementById('pane-content').innerHTML = '<p style="padding:1.5rem">No backups found.</p>';
                return;
            }

            let rows = backups.map(b => {

                        <td>${b.type}</td>
                        <td>${formatBytes(b.size)}</td>

                `;
            }).join('');

            document.getElementById('pane-content').innerHTML = `
                <table class="data-table">
                    <thead>

                            <th>Size</th>

                        </tr>

    async function manualBackup() {
        const btn = document.getElementById('btn-manual-backup');
        const backupType = document.getElementById('manual-backup-type').value;
        const origText = btn.innerText;
        btn.disabled = true;
        btn.innerText = 'Creating...';
        try {
            await api('/backup', { method: 'POST', body: { type: backupType } });
            loadBackupManager();
        } catch (e) {
            alert('Backup failed: ' + e.message);
        }
        btn.disabled = false;
        btn.innerText = origText;
    }

    function downloadBackup(filename) {
        window.location.href = '/api/backup/download?file=' + encodeURIComponent(filename);
    }

    async function restoreBackup(filename) {
        if (!confirm(`Are you sure you want to restore from "${filename}"?\n\nThis will OVERWRITE current data and RESTART the server. The admin panel will become unresponsive during the process and then reload.`)) {
            return;
        }

        openModal('Restoring Backup...', '<div class="loader"></div><p style="text-align:center;">Please wait. The server is being restored. This page will reload automatically.</p>');
        document.querySelector('#modal').style.pointerEvents = 'none';

        try {
            await api('/backup/restore', { method: 'POST', body: { file: filename } });
            setTimeout(() => window.location.reload(), 5000);
        } catch (e) {
            alert('Restore failed: ' + e.message);
            document.querySelector('#modal').style.pointerEvents = 'auto';
            closeModal();
        }
    }

    async function deleteBackup(filename) {
        if (confirm(`Are you sure you want to delete the backup file "${filename}"? This action cannot be undone.`)) {
            try {
                await api(`/backup?file=${encodeURIComponent(filename)}`, { method: 'DELETE' });
                loadBackupManager();
            } catch (e) {
                alert('Delete failed: ' + e.message);
            }
        }
    }

let relSearchTimeout;
    async function openRelSelect(fieldName, targetCol, search = '') {
      document.getElementById('rel-modal-title').innerText = `Select ${fieldName} from ${targetCol}`;
      document.getElementById('rel-modal').style.display = 'flex';

      const res = await api(`/collections/${targetCol}?search=${encodeURIComponent(search)}`);
      let items = res.items ||[];

      let html = `<div class="form-field">
        <input type="text" id="rel-search-inp" placeholder="" value="${search}" oninput="clearTimeout(relSearchTimeout); relSearchTimeout=setTimeout(()=>openRelSelect('${fieldName}', '${targetCol}', this.value), 300)">
        <label>Search...</label>
      </div>`;

      if (items.length === 0) {
        html += `<div style="padding:1rem; text-align:center;">No items found.</div>`;
      } else {
        const colDef = state.collections.find(c => c.name === targetCol);
        let schema = colDef ? colDef.schema || [] : [];
        const cols =['id', ...schema.map(s => s.name)];
        let ths = cols.map(c => `<th style="position: sticky; top: 0;">${c}</th>`).join('');

        html += `<div style="width: 100%; overflow-x: auto; max-height: 480px; position: relative;">
          <table class="data-table">
            <thead>
              <tr>${ths}</tr>
            </thead>
            <tbody>
              ${items.map(itm => `
                <tr onclick="selectRelItem('${fieldName}', '${itm.id}')" title="Select #${itm.id}">
                  ${cols.map(c => {
          let val = itm[c];
          let sc = state.schema.find(s => s.name === c);
          if (sc && sc.type === 'bool') {
            if (val === undefined || val === null || val === '') return `<td></td>`;
            return `<td>${(val === true || val === 1 || val === 'true') ? 'true' : 'false'}</td>`;
          }
          
          if (sc && state.collections.some(col => col.name === sc.type)) {
              if (val === undefined || val === null || val === '') return `<td></td>`;
              if (typeof val === 'object' && val !== null) {
                  return `<td>${val.name || val.title || val.id || JSON.stringify(val)}</td>`;
              }
          }

          return `<td>${val !== undefined && val !== null ? val : ''}</td>`;
        }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
      }

      html += `<button class="btn danger" onclick="closeRelModal()">Cancel</button>`;

      document.getElementById('rel-modal-body').innerHTML = html;
      setTimeout(() => {
        let inp = document.getElementById('rel-search-inp');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }, 50);
    }

    async function renameItem(base, oldPath) {
      let newName = document.getElementById('rename-new-name').value.trim();
      if (!newName) return;
      
      let parts = oldPath.split('/');
      parts.pop();
      parts.push(newName);
      let newPath = parts.join('/');

      if (oldPath === newPath) {
         closeModal();
         return;
      }

      let btn = document.getElementById('modal-confirm-btn');
      btn.disabled = true;
      btn.innerText = "Renaming...";

      try {
        await api(`/files/rename`, { method: 'POST', body: { base: base, old_path: oldPath, new_path: newPath } });
        
        for (let k in window.fileEditorCache) {
            if (k.startsWith(base + "_") && window.fileEditorCache[k].path && window.fileEditorCache[k].path.startsWith(oldPath)) {
                if (window.activeEditor && window.activeEditor.path === window.fileEditorCache[k].path) {
                    window.activeEditor = null;
                    document.getElementById('pane-content').innerHTML = '';
                    document.getElementById('pane-header').innerHTML = '';
                }
                delete window.fileEditorCache[k];
            }
        }

        closeModal();
        loadAllFiles();
      } catch (e) {
        alert("Rename failed: " + e.message);
        btn.disabled = false;
        btn.innerText = "Rename";
      }
    }

    function bindFileTreeDnD() {
      setTimeout(() => {
        const fileTree = document.querySelector('.file-tree');
        if (fileTree && !fileTree.dataset.dndBound) {
          fileTree.dataset.dndBound = true;
          
          let draggedBase = null;
          let draggedPath = null;

          fileTree.addEventListener('dragstart', (e) => {
            const target = e.target.closest('.tree-item');
            if (target && target.getAttribute('draggable') === 'true') {
              draggedBase = target.getAttribute('data-base');
              draggedPath = target.getAttribute('data-path');
              e.dataTransfer.setData('text/plain', draggedPath);
              e.dataTransfer.effectAllowed = 'move';
            }
          });

          fileTree.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.querySelectorAll('.tree-item.drag-over').forEach(el => el.classList.remove('drag-over'));
            const target = e.target.closest('.tree-item');
            if (target) target.classList.add('drag-over');
          });

          fileTree.addEventListener('dragleave', (e) => {
            const target = e.target.closest('.tree-item');
            if (target) target.classList.remove('drag-over');
          });

          fileTree.addEventListener('drop', async (e) => {
            e.preventDefault();
            document.querySelectorAll('.tree-item.drag-over').forEach(el => el.classList.remove('drag-over'));
            
            let target = e.target.closest('.tree-item');
            let targetPath = '';
            let targetBase = '';
            
            if (target) {
              targetPath = target.getAttribute('data-path') || '';
              targetBase = target.getAttribute('data-base');
              if (target.tagName.toLowerCase() === 'li') {
                let lastSlash = targetPath.lastIndexOf('/');
                targetPath = lastSlash >= 0 ? targetPath.substring(0, lastSlash) : '';
              }
            }

            if (e.dataTransfer.files && e.dataTransfer.files.length) {
                if (!targetBase) return; 
                await window.uploadFiles(targetBase, targetPath, e.dataTransfer.files);
                return;
            }

            if (draggedBase && draggedPath) {
              if (targetBase !== draggedBase) {
                 alert("Cannot move files between different root directories.");
                 return;
              }
              if (targetPath === draggedPath || targetPath.startsWith(draggedPath + '/')) {
                 return; 
              }

              let parts = draggedPath.split('/');
              let fileName = parts.pop();
              let newPath = targetPath ? targetPath + '/' + fileName : fileName;

              if (newPath === draggedPath) return;

              try {
                await api(`/files/rename`, { method: 'POST', body: { base: draggedBase, old_path: draggedPath, new_path: newPath } });
                
                for (let k in window.fileEditorCache) {
                    if (k.startsWith(draggedBase + "_") && window.fileEditorCache[k].path && window.fileEditorCache[k].path.startsWith(draggedPath)) {
                        delete window.fileEditorCache[k];
                    }
                }
                if (window.activeEditor && window.activeEditor.base === draggedBase && window.activeEditor.path.startsWith(draggedPath)) {
                    window.activeEditor = null;
                    document.getElementById('pane-content').innerHTML = '';
                    document.getElementById('pane-header').innerHTML = '';
                }

                loadAllFiles();
              } catch (err) {
                alert("Move failed: " + err.message);
              }
            }
          });
        }
      }, 0);
    }
    
    async function loadAllFiles() {
      const basesInfo = await api('/files?base=root');
      
      let allFilesTree = {};
      for (const b of basesInfo) {
        let baseName = b.path;
        try {
            const files = await api(`/files?base=${baseName}`);
            let tree = {};
            files.forEach(f => {
              let parts = f.path.split('/');
              let cur = tree;
              for (let i = 0; i < parts.length; i++) {
                let p = parts[i];
                if (i === parts.length - 1) cur[p] = f.is_dir ? {} : { size: f.size };
                else { if (!cur[p]) cur[p] = {}; cur = cur[p]; }
              }
            });
            allFilesTree[baseName] = tree;
        } catch(e) { }
      }

      function buildHtml(node, prefix = "", baseName) {
        let html = "";
        const renameIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16M8 4h8M8 20h8"/></svg>`;
        
        for (let k in node) {

          if (node[k] && node[k].size !== undefined) {

            <div class="tree-actions">
              <span onclick="event.stopPropagation(); renameModal('${baseName}', '${esc(path)}')">${renameIcon}</span>
              <span class="del" onclick="event.stopPropagation(); deleteFile('${baseName}', '${esc(path)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
            </div>
          </li>`;
          } else {
            let stateKey = `files_${baseName}`;
            if (!state.openFolders[stateKey]) state.openFolders[stateKey] = new Set(['']);
            let isOpen = state.openFolders[stateKey].has(path) ? 'open' : '';
            html += `<details ${isOpen}>
              <summary class="tree-item" draggable="true" data-base="${baseName}" data-path="${esc(path)}">
                <span class="tree-label folder-label" title="${k}">${k}</span>
                <div class="tree-actions">
                  <span onclick="event.preventDefault(); newFileModal('${baseName}', '${esc(path)}')" title="New in Folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14"/></svg></span>
                  <span onclick="event.preventDefault(); renameModal('${baseName}', '${esc(path)}')">${renameIcon}</span>
                  <span class="del" onclick="event.preventDefault(); deleteFile('${baseName}', '${esc(path)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                </div>
              </summary>
              <ul>${buildHtml(node[k], path, baseName)}</ul>
            </details>`;
          }
        }
        return html;
      }

      let subHtml = `<div class="file-tree">`;
      for (let baseName in allFilesTree) {
        let stateKey = `files_${baseName}`;
        if (!state.openFolders[stateKey]) state.openFolders[stateKey] = new Set(['']);
        let isOpen = state.openFolders[stateKey].has('') ? 'open' : '';
        subHtml += `
          <div>
            <details ${isOpen}>
              <summary class="tree-item root-item" data-base="${baseName}" data-path="">
                <span class="tree-label folder-label" style="text-transform: capitalize;">${baseName}</span>
                <div class="tree-actions">
                  <span onclick="event.preventDefault(); newFileModal('${baseName}', '')" title="New file/folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14"/></svg></span>
                </div>
              </summary>
              <ul>${buildHtml(allFilesTree[baseName], "", baseName) || `<i class="text-muted ml-6 text-sm">&nbsp&nbspempty folder</i>`}</ul>
            </details>
          </div>
        `;
      }
      subHtml += `</div>`;

      document.getElementById('sub-sidebar').innerHTML = subHtml;

if (!window.activeEditor) {
        document.getElementById('pane-content').innerHTML = ``;
        document.getElementById('pane-header').innerHTML = `<h2>Files</h2><div><button class="btn secondary" onclick="showApiDocs()">Lua API Reference</button></div>`;
      }

      bindFileTreeDnD();

      if (!window.activeEditor && window.fileEditorCache['files_active']) {
          let cache = window.fileEditorCache['files_active'];
          editFile(cache.base, cache.path, 0);
      }
    }

    const extMap = { 'js': 'javascript', 'ts': 'typescript', 'py': 'python', 'sh': 'bash', 'md': 'markdown' };

async function editFile(base, path, size) {
    if (window.activeEditor && window.activeEditor.path !== path) {
        if (window.activeEditor.editor && window.activeEditor.editor.value !== window.activeEditor.originalContent) {
            if (!confirm("You have unsaved changes in the current file. Discard them?")) return;
        }
    }

    if (window.activeEditor && window.activeEditor.element && window.activeEditor.element.parentNode) {
        window.activeEditor.element.parentNode.removeChild(window.activeEditor.element);
    }
    window.activeEditor = null; 
    
    document.querySelectorAll('.sub-sidebar .sub-item, .sub-sidebar .tree-item').forEach(el => el.classList.remove('active'));
    let activeItem = document.querySelector(`.sub-sidebar .tree-item[data-path="${esc(path)}"]`);
    if (activeItem) activeItem.classList.add('active');

    let apiBtnHtml = '';
    if (path.endsWith('.lua')) {
        apiBtnHtml = `<button class="btn secondary" onclick="showApiDocs()">Lua API Reference</button> `;
    }

    document.getElementById('pane-header').innerHTML = `
        <h2 style="font-family: monospace;">${base}/${path}</h2>
        <div>${apiBtnHtml}<button id="btn-save-file" class="btn" disabled onclick="saveFile('${base}', '${esc(path)}')" title="Ctrl+S">Save changes</button></div>
    `;

    const MAX_PREVIEW_SIZE = 20 * 1024 * 1024; // 20MB
    const ext = path.split('.').pop().toLowerCase();
    
    if (path.match(/\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)$/i) || path.match(/\.(mp3|wav|ogg|flac|aac|m4a)$/i) || path.match(/\.(mp4|webm|ogg)$/i)) {
        if (size > MAX_PREVIEW_SIZE) {
            document.getElementById('pane-content').innerHTML = `
                <div style="text-align:center; padding:2rem">
                    <p>File too large to preview (${(size / (1024*1024)).toFixed(2)} MB).</p>
                    <button class="btn" onclick="previewFileForce('${base}', '${esc(path)}')">Preview anyway</button>
                </div>
            `;
        } else {
            previewFile(base, path);
        }
        return;
    }
    
    document.getElementById('pane-content').innerHTML = '';

    let cacheKey = base + "_" + path;
    window.fileEditorCache['files_active'] = { base: base, path: path };

    if (window.fileEditorCache[cacheKey]) {
        let cache = window.fileEditorCache[cacheKey];
        document.getElementById('pane-content').appendChild(cache.element);
        window.activeEditor = cache;
        window.editor = cache.editor;
        
        const btn = document.getElementById('btn-save-file');
        if (btn) btn.disabled = (cache.editor.value === cache.originalContent);
        return;
    }

    const res = await api(`/files?base=${base}&path=${path}`);
    let normalizedContent = (res.content || '').replace(/\r\n/g, '\n');
    
    let extMapped = extMap[ext] || ext;

    let wrapperId = "editor-" + Date.now() + Math.floor(Math.random()*1000);
    let editorWrapper = document.createElement('div');
    editorWrapper.id = wrapperId;
    editorWrapper.style = "height:calc(100% - 1rem); width:100%;";
    document.getElementById('pane-content').appendChild(editorWrapper);

    let edTheme = localStorage.getItem('mogo_editor_theme') || 'auto';
    let edTabSize = parseInt(localStorage.getItem('mogo_editor_tabSize') || '3', 10);
    let edInsertSpaces = localStorage.getItem('mogo_editor_insertSpaces') === 'true';
    let edWordWrap = localStorage.getItem('mogo_editor_wordWrap') !== 'false';
    
    let adminTheme = localStorage.getItem('mogo_theme') || 'auto';
    if (adminTheme === 'auto') {
        adminTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    
    let isDark = edTheme === 'dark' || (edTheme === 'auto' && adminTheme === 'dark');

    window.activeEditor = {
        base: base,
        path: path,
        element: editorWrapper,
        editor: null,
        originalContent: normalizedContent
    };

    window.editor = createEditor('#' + wrapperId, {
        language: extMapped,
        value: normalizedContent,
        tabSize: edTabSize,
        insertSpaces: edInsertSpaces,
        wordWrap: edWordWrap,
        onUpdate(code) {
            const btn = document.getElementById('btn-save-file');
            if (btn && window.activeEditor) {
                btn.disabled = (code === window.activeEditor.originalContent);
            }
        }
    });
    
    window.activeEditor.editor = window.editor;

    if (isDark) {
        editorWrapper.classList.add('editor-dark');
    }
    
    window.fileEditorCache[cacheKey] = window.activeEditor;
}

window.previewFileForce = function(base, path) {

window.previewFile = function(base, path) {
    const ext = path.split('.').pop().toLowerCase();

    if (path.match(/\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)$/i)) {

    } else if (path.match(/\.(mp4|webm|ogg)$/i)) {

};

function showApiDocs() {
      document.getElementById('modal-title').innerText = "Lua API Reference";
      document.getElementById('modal-body').innerHTML = `
<div id="api-ref">
    <div>
        <h5>req (Request Table)</h5>
        <ul>
            <li><b>req.method</b>, <b>req.path</b> <i>(string)</i> - HTTP method and path</li>
            <li><b>req.query</b>, <b>req.params</b> <i>(table)</i> - URL query string and parsed route parameters</li>
            <li><b>req.headers</b>, <b>req.cookies</b> <i>(table)</i> - Request headers (lowercase keys) and cookies</li>
            <li><b>req.body</b> <i>(string/table)</i> - Parsed JSON, form data, or raw string</li>
            <li><b>req.ip</b> <i>(string)</i> - Request origin IP</li>
            <li><b>req.files.<i>field</i></b> <i>(table)</i> - Uploaded files containing <b>filename</b>, <b>size</b>, and <b>save(destPath)</b> <i>(function returning boolean)</i></li>
        </ul>
    </div>
    <div>
        <h5>res (Response Table)</h5>
        <ul>
            <li><b>res.status</b> <i>(number)</i> - HTTP status code (default: 200)</li>
            <li><b>res.headers</b> <i>(table)</i> - Response headers</li>
            <li><b>res.body</b> <i>(string/table)</i> - Response body (setting this overrides returned data)</li>
            <li><b>res.cookies.<i>name</i></b> <i>(table/string)</i> - Set cookies. Can be a string (value) or table with fields: <b>value</b>, <b>path</b>, <b>http_only</b>, <b>secure</b>, <b>max_age</b>, <b>same_site</b>, <b>delete</b></li>
            <li><b>res:file(path, <i>[filename]</i>)</b> - Sends a file as a download response</li>
        </ul>
    </div>
    <div>
        <h5>Implicit Returns</h5>
        <p>Instead of manually setting <b>res.body</b>, you can directly return values from your handler:</p>
        <ul>
            <li><i>return "string"</i> - Sends HTML (Content-Type: text/html)</li>
            <li><i>return { key = "value" }</i> - Sends JSON (Content-Type: application/json)</li>
            <li><i>return function() ... end</i> - Runs a post-response function (cleanup, logging, etc.). Can be combined with a string/table return as the second value.</li>
        </ul>
        <p>Any <b>res</b> fields you set (status, headers, cookies) override the returned data.</p>
    </div>
    <div>
        <h5>db (Collections API)</h5>
        <ul>
            <li><b>db.&#60;col&#62;:get(<i>[query]</i>, <i>[limit]</i>, <i>[sort_by]</i>)</b> - Returns array of matching records, ascending by ID by default. Use <i>limit = 0</i> for no limit. Negative limit to reverse order. Relational fields expand automatically into nested tables.</li>
            <li><b>db.&#60;col&#62;:insert(data)</b> - Inserts a row (auto-generates <i>id</i>, <i>created</i>, <i>updated</i>) and returns the new record's ID.</li>
            <li><b>db.&#60;col&#62;:update(query, updates)</b> - Updates matching records. Processes sequentially; returns an array of result objects: <i>{{id=1, result=true}, {id=2, result=false, err="..."}}</i>.</li>
            <li><b>db.&#60;col&#62;:delete(query)</b> - Deletes matching records. Processes sequentially; returns an array of result objects.</li>
            <li><b>db("SELECT * FROM tbl WHERE id = ?", id)</b> - Execute raw SQL. Returns a table for SELECT/PRAGMA, or <i>boolean, rowsAffected</i> for mutations. <b>Bypasses all middleware hooks.</b></li>
        </ul>
    </div>
    <div>
        <h5>Collection Middleware</h5>
        <p>Scripts in the <code>middleware/</code> directory can intercept DB operations. Return a table of hooks:</p>
        <ul>
            <li><b>pre_insert(data)</b> / <b>pre_update(item, data)</b> - Return modified data/true to proceed, or <i>nil, "Error"</i> to abort.</li>
            <li><b>post_insert(item)</b> / <b>post_update(item, applied_data)</b> / <b>post_delete(item)</b> - Run after successful mutations.</li>
            <li><b>pre_delete(item)</b> - Return <i>true</i> to proceed, or <i>nil, "Error"</i> to abort.</li>
            <li><b>item(record)</b> - Formatter hook. Runs on every item retrieved via <i>db:get()</i> or expanded as a relation. Return modified record.</li>
        </ul>
    </div>
    <div>
        <h5>http</h5>
        <ul>
            <li><b>http(method, url, <i>[opts]</i>)</b> - Performs an HTTP request. <b>method</b> is a string (GET, POST, etc.).</li>
        </ul>
        <p><b>opts</b> is a table: <i>{ headers = {key="val"}, body = "data" }</i>. Returns a table: <i>{ status, body, headers }</i>.</p>
    </div>
    <div>
        <h5>log</h5>
        <ul>
            <li><b>log.info(msg)</b>, <b>log.warn(msg)</b>, <b>log.error(msg)</b> - Writes to the system log database.</li>
            <li><b>log:get(<i>[limit]</i>)</b> - Retrieves the latest logs as an array of tables: <i>{id, timestamp, level, origin, script, message}</i>.</li>
        </ul>
    </div>
    <div>
        <h5>Standard Libraries & Security</h5>
        <p>The standard Lua libraries <b>table</b>, <b>string</b>, <b>math</b>, and <b>coroutine</b> are fully available. The <b>os</b> library is restricted (dangerous functions stripped) and <b>io</b> is unavailable by default. Enabling <i>"Allow Unsafe Lua"</i> in the Admin Settings exposes the complete <b>io</b> and <b>debug</b> libraries and removes directory jailing for file operations.</p>
    </div>
</div>

       `;

    async function saveFile(base, path) {
    let content = window.editor ? window.editor.value : document.getElementById('file-editor').value;
    let btn = document.getElementById('btn-save-file');
    btn.innerText = "Saving...";
    btn.disabled = true;
    
    try {
        await api(`/files?base=${base}`, { method: 'POST', body: { path: path, content: content, is_dir: false } });
        
        if (window.activeEditor) window.activeEditor.originalContent = content;
        if (window.fileEditorCache[base + "_" + path]) {
            window.fileEditorCache[base + "_" + path].originalContent = content;
        }
        btn.innerText = "Save changes";
    } catch (err) {
        alert("Failed to save: " + err.message);
        btn.innerText = "Save changes";
        btn.disabled = false;
    }
}

async function deleteFile(base, path) {
    if (confirm('Delete?')) {
        await api(`/files?base=${base}&path=${path}`, { method: 'DELETE' });
        
        let cacheKey = base + "_" + path;
        if (window.fileEditorCache[cacheKey]) {
            if (window.activeEditor && window.activeEditor.path === path) {
                if (window.activeEditor.element && window.activeEditor.element.parentNode) {
                    window.activeEditor.element.parentNode.removeChild(window.activeEditor.element);
                }
                window.activeEditor = null;
                document.getElementById('pane-content').innerHTML = '';
                document.getElementById('pane-header').innerHTML = '';
            }
            delete window.fileEditorCache[cacheKey];
        }
        
        loadAllFiles();
    }
}
