<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mogo Admin</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="prism-code.js"></script>
  <style>.prism-code-editor { height: 100%; }</style>
</head>

<body>

  <div id="login-view">
    <form id="login-form">
      <h2>Mogo Admin</h2>
      <div class="form-field"><input id="api-key" placeholder="" type="password" required autofocus><label>
          API key
        </label></div>
      <button type="submit" class="btn">Access</button>
    </form>
  </div>

  <div id="app-view">
    <div class="sidebar">

            stroke-linecap="round" stroke-linejoin="round" />

      </div>
      <div class="icon-btn" onclick="nav('public')" title="Public">
        <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 18H10.5H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"

            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M14 5V8.4C14 8.73137 14.2686 9 14.6 9H18" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />

      <div class="icon-btn" onclick="nav('logs')" title="Logs">
        <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>

          <path
            d="M19.6224 10.3954L18.5247 7.7448L20 6L18 4L16.2647 5.48295L13.5578 4.36974L12.9353 2H10.981L10.3491 4.40113L7.70441 5.51596L6 4L4 6L5.45337 7.78885L4.3725 10.4463L2 11V13L4.40111 13.6555L5.51575 16.2997L4 18L6 20L7.79116 18.5403L10.397 19.6123L11 22H13L13.6045 19.6132L16.2551 18.5155C16.6969 18.8313 18 20 18 20L20 18L18.5159 16.2494L19.6139 13.598L21.9999 12.9772L22 11L19.6224 10.3954Z"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>

    <div id="sub-sidebar" class="sub-sidebar"></div>

    <div id="main-pane" class="main-pane">
      <div class="pane-header" id="pane-header"></div>
      <div class="pane-content" id="pane-content"></div>
      <div id="selection-popup" class="popup-bar">
        <button class="btn danger" onclick="deleteSelected()">Delete Selected</button>
        <button class="btn" onclick="clearSelection()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
  <div id="rel-modal" class="modal-overlay" style="z-index: 2000;">
    <div class="modal" style="max-width: min(640px, 80%);">
      <div class="modal-header">
        <h3 id="rel-modal-title"></h3>
      </div>
      <div id="rel-modal-body" class="modal-body"></div>
    </div>
  </div>

<script>
  function getSystemTheme() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    // If no argument, read from localStorage, fallback to 'auto'
    theme = theme || localStorage.getItem('mogo_theme') || 'auto';

    // Determine the actual class to apply
    let effectiveTheme = theme;
    if (effectiveTheme === 'auto') {
      effectiveTheme = getSystemTheme();
    }

    // Remove any existing theme class and apply the new one
    document.documentElement.classList.remove('theme-light', 'theme-dark');
    document.documentElement.classList.add(`theme-${effectiveTheme}`);

    // Store the user's preference (not the resolved theme)
    localStorage.setItem('mogo_theme', theme);
  }

  // Run on page load
  applyTheme();

  // Optional: listen for system preference changes when in 'auto' mode
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (localStorage.getItem('mogo_theme') === 'auto') {
      applyTheme('auto');
    }
  });

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        if (e.target.id === 'rel-modal') {
          closeRelModal();
        } else if (e.target.id === 'modal') {
          closeModal();
        }
      }
    });
    
    let state = {
      tab: '', sub: '', data: [], schema:[], selected: new Set(),
      collections: [], keys: [], crons:[], settings: null,
      sort: { col: 'id', asc: true }
    };

    // ----- Sorting Utility -----
    function handleSort(col) {
      if (state.sort.col === col) {
        state.sort.asc = !state.sort.asc;
      } else {
        state.sort.col = col;
        state.sort.asc = true;
      }
      if (state.tab === 'collections') renderCollectionTable();
      if (state.tab === 'keys') renderKeysTable();
      if (state.tab === 'schedules') renderCronsTable();
    }

    function sortData(arr) {
      let { col, asc } = state.sort;
      return arr.sort((a, b) => {
        let va = a[col];
        let vb = b[col];
        if (va === vb) return 0;
        if (va == null) return asc ? -1 : 1;
        if (vb == null) return asc ? 1 : -1;
        if (typeof va === 'string' && typeof vb === 'string') {
          return asc ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        return asc ? (va < vb ? -1 : 1) : (va > vb ? -1 : 1);
      });
    }

    function th(col, label) {
      let arrow = state.sort.col === col ? (state.sort.asc ? ' ▲' : ' ▼') : '';
      return `<th onclick="handleSort('${col}')" class="sortable-header">${label || col}${arrow}</th>`;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('modal').style.display === 'flex') {
        closeModal();
      }
      // Enter to confirm modals
      if (e.key === 'Enter' && document.getElementById('modal').style.display === 'flex') {
        if (e.target.tagName === 'TEXTAREA') return; // Allow newlines in textareas
        const confirmBtn = document.getElementById('modal-confirm-btn');
        if (confirmBtn && !confirmBtn.disabled) {
          e.preventDefault();
          confirmBtn.click();
        }
      }
      // Ctrl+S or Cmd+S to save file
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        const saveBtn = document.getElementById('btn-save-file');
        if (saveBtn && !saveBtn.disabled) {
          e.preventDefault();
          saveBtn.click();
        } else if (saveBtn && saveBtn.disabled) {
          e.preventDefault(); // Prevent browser save dialog even if no changes
        }
      }
    });

    function esc(s) { return s.replace(/'/g, "\\'"); }

    async function api(path, opts = {}) {
      opts.headers = { ...opts.headers, "Content-Type": "application/json" };
      if (opts.body && typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
      const res = await fetch(`/api${path}`, opts);
      if (res.status === 401) { showLogin(); throw new Error("Unauthorized"); }
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    // ---------- Drag and Drop List Reordering logic ----------
    let dragInfo = null;
    window.startDrag = function (e, index) {
      if (e.button !== 0) return; // Allow only left click
      e.preventDefault();

      const container = document.getElementById('schema-fields-container');
      const row = e.target.closest('.schema-row');
      const rect = row.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();

      const placeholder = document.createElement('div');
      placeholder.className = 'hbox schema-row placeholder';
      placeholder.style.height = rect.height + 'px';
      placeholder.style.border = '2px dashed var(--bg-3)';
      placeholder.style.borderRadius = '4px';
      placeholder.style.boxSizing = 'border-box';

      row.style.position = 'absolute';
      row.style.zIndex = '1000';
      row.style.width = rect.width + 'px';
      row.style.top = (rect.top - containerRect.top) + 'px';
      row.style.left = (rect.left - containerRect.left) + 'px';
      row.style.boxShadow = 'var(--shadow)';
      row.style.background = 'var(--card-bg)'; // Maintain visual block integrity

      container.insertBefore(placeholder, row.nextSibling);

      const startY = e.clientY;
      const startTop = rect.top - containerRect.top;

      dragInfo = { row, placeholder, container, startY, startTop, index };

      document.addEventListener('pointermove', window.onDragMove);
      document.addEventListener('pointerup', window.onDragEnd);
    };

    window.onDragMove = function (e) {
      if (!dragInfo) return;
      e.preventDefault();
      const { row, placeholder, container, startY, startTop } = dragInfo;

      // Update visual positioning relative to drag
      const dy = e.clientY - startY;
      row.style.top = (startTop + dy) + 'px';

      const siblings = Array.from(container.children).filter(c => c !== row && c !== placeholder && c.classList.contains('schema-row'));
      const rowCenter = e.clientY;

      let inserted = false;
      for (let i = 0; i < siblings.length; i++) {
        const rect = siblings[i].getBoundingClientRect();
        if (rowCenter < rect.top + rect.height / 2) {
          container.insertBefore(placeholder, siblings[i]);
          inserted = true;
          break;
        }
      }
      if (!inserted) {
        container.appendChild(placeholder);
      }
    };

    window.onDragEnd = function (e) {
      if (!dragInfo) return;
      document.removeEventListener('pointermove', window.onDragMove);
      document.removeEventListener('pointerup', window.onDragEnd);

      const { row, placeholder, container, index } = dragInfo;

      // Measure placeholder's final DOM location to translate to schema array offset
      const siblingsAndPlaceholder = Array.from(container.children).filter(c => c.classList.contains('schema-row') && c !== row);
      const newIndex = siblingsAndPlaceholder.indexOf(placeholder);

      row.style.position = '';
      row.style.zIndex = '';
      row.style.width = '';
      row.style.top = '';
      row.style.left = '';
      row.style.boxShadow = '';
      row.style.background = '';

      container.insertBefore(row, placeholder);
      placeholder.remove();

      // Reorder items in state tracking variable
      if (newIndex !== -1 && newIndex !== index) {
        const item = window._tempSchema.splice(index, 1)[0];
        window._tempSchema.splice(newIndex, 0, item);
        renderSchemaModal();
      }

      dragInfo = null;
    };


    // ---------- logs ----------
    async function loadLogs(level = '', offset = 0) {
      document.getElementById('pane-header').innerHTML = `
        <h2>Logs</h2>
        <div style="display:flex; gap: 8px;">
          <select id="log-level-filter" onchange="loadLogs(this.value, 0)">
            <option value="">All Levels</option>
            <option value="info" ${level === 'info' ? 'selected' : ''}>Info</option>
            <option value="warn" ${level === 'warn' ? 'selected' : ''}>Warn</option>
            <option value="error" ${level === 'error' ? 'selected' : ''}>Error</option>
          </select>
          <button class="btn danger" onclick="clearLogs()">Clear All Logs</button>
        </div>
      `;

      const res = await api(`/logs?level=${level}`);
      const logs = res.logs ||[];
      state.logs = logs; // save for viewing details

      let html = `<table class="data-table"><thead><tr>
        <th>ID</th><th>Timestamp</th><th>Level</th><th>Origin</th><th>Script</th><th>Message</th>
      </tr></thead><tbody>`;

      if (logs.length === 0) {
        html += `<tr style="box-shadow: none;"><td colspan="6" style="text-align:center; padding: 2rem; cursor: default;">No logs found.</td></tr>`;
      } else {
        logs.forEach((l, idx) => {
          let badgeColor = l.level === 'error' ? 'var(--fail)' : (l.level === 'warn' ? 'var(--warn)' : 'var(--success)');
          let shortMsg = l.message ? (l.message.length > 60 ? l.message.substring(0, 60) + '...' : l.message) : '';
          shortMsg = shortMsg.replace(/</g, "&lt;");
          html += `<tr style="cursor:pointer" onclick="viewLogDetail(${idx})">
            <td>${l.id}</td>
            <td style="white-space:nowrap">${new Date(l.timestamp).toLocaleString()}</td>
            <td><span style="background:${badgeColor};">${l.level}</span></td>
            <td>${l.origin || ''}</td>
            <td>${l.script_path || ''}</td>
            <td style="max-width:300px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"><code>${shortMsg}</code></td>
          </tr>`;
        });
      }
      html += `</tbody></table>`;


      document.getElementById('pane-content').innerHTML = html;
    }

    async function clearLogs() {
      if (!confirm("Are you sure you want to delete ALL logs? This cannot be undone.")) return;
      await api('/logs', { method: 'DELETE' });
      loadLogs(document.getElementById('log-level-filter').value, 0);
    }

    function viewLogDetail(idx) {
      let l = state.logs[idx];
      document.getElementById('modal-title').innerText = `Log #${l.id}`;
      document.getElementById('modal-body').innerHTML = `
        <div class="log">
        <span><b>Timestamp</b>: ${new Date(l.timestamp).toLocaleString()}</span>
        <span><b>Level</b>:       ${l.level}</span>
        <span><b>Origin</b>:      ${l.origin}</span>
        <span><b>Script</b>:      ${l.script_path}</span>
        <hr>
        <div>${l.message ? l.message.replace(/</g, "&lt;") : ''}</div>
        </div>
      `;
      document.getElementById('modal').style.display = 'flex';
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const autoKey = params.get('key');
      if (autoKey) {
        window.history.replaceState({}, document.title, window.location.pathname);
        try { await api('/auth/login', { method: 'POST', body: { api_key: autoKey } }); }
        catch (e) { /* ignore auto-login failure */ }
      }

      try {
        await api('/auth/check');
        state.settings = await api('/settings');
        showApp();
      } catch { showLogin(); }
    }

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/auth/login', { method: 'POST', body: { api_key: document.getElementById('api-key').value } });
        state.settings = await api('/settings');
        showApp();
      } catch (e) { alert("Invalid API Key"); }
    };

    function showLogin() { document.getElementById('app-view').style.display = 'none'; document.getElementById('login-view').style.display = 'flex'; }
    function showApp() { document.getElementById('login-view').style.display = 'none'; document.getElementById('app-view').style.display = 'flex'; nav('collections'); }

    function nav(tab) {
      state.tab = tab; state.sub = ''; state.search = '';
      state.sort = { col: 'id', asc: true };
      document.querySelectorAll('.icon-btn').forEach(e => e.classList.remove('active'));

      // Automatically select appropriate icon if calling nav('...') programmatically or via click
      let iconBtn = document.querySelector(`.icon-btn[onclick="nav('${tab}')"]`);
      if (iconBtn) iconBtn.classList.add('active');

      document.getElementById('sub-sidebar').style.display =['collections', 'routes', 'public', 'schedules', 'settings'].includes(tab) ? 'flex' : 'none';
      document.getElementById('pane-header').style.display = '';
      document.getElementById('pane-header').innerHTML = '';
      document.getElementById('pane-content').innerHTML = '';
      document.getElementById('selection-popup').classList.remove('show');

      if (tab === 'collections') loadCollections();
      if (tab === 'keys') loadKeys();
      if (tab === 'settings') loadSettings('admin');
      if (tab === 'logs') loadLogs();
      if (tab === 'routes' || tab === 'public' || tab === 'schedules') loadFiles(tab);
    }

    // ---------- collections ----------
    async function loadCollections() {
      const cols = await api('/collections');
      state.collections = cols;
      let html = cols.map(c => `<div class="sub-item ${c.name === state.sub ? 'active' : ''}" onclick="viewCollection('${c.name}')">${c.name}</div>`).join('');
      html += `<button class="btn btn-block" onclick="editSchemaModal()">+ New Collection</button>`;
      document.getElementById('sub-sidebar').innerHTML = html;

      if (cols.length > 0 && !state.sub) {
        viewCollection(cols[0].name);
      } else if (cols.length === 0) {
        document.getElementById('pane-header').innerHTML = '<h2>Collections</h2>';
        document.getElementById('pane-content').innerHTML = '<p style="padding:1.5rem">No collections found.</p>';
      }
    }

    async function viewCollection(name) {
      state.sub = name;
      state.sort = { col: 'id', asc: true };
      document.querySelectorAll('.sub-sidebar .sub-item').forEach(el => el.classList.remove('active'));
      const subItem = Array.from(document.querySelectorAll('.sub-sidebar .sub-item')).find(el => el.innerText === name);
      if (subItem) subItem.classList.add('active');

      const col = state.collections.find(c => c.name === name);
      if (!col) return;

      state.schema = col.schema ||[];
      const res = await api(`/collections/${name}?search=${encodeURIComponent(state.search || '')}`);
      state.data = res.items ||[];

      state.selected.clear();
      renderCollectionTable();
    }

    function renderCollectionTable() {
      const cols =['id', ...state.schema.map(s => s.name)];
      document.getElementById('pane-header').innerHTML = `
      <h2>${state.sub}</h2>
      <div class="hbox">
        <div class="form-field" style="margin:0; width:250px"><input type="text" id="coll-search" placeholder=" " value="${state.search || ''}" oninput="debounceSearch(this.value)"><label>Search (or field:value)...</label></div>
        <button class="btn danger" onclick="deleteCollection('${state.sub}')">Delete Collection</button>
        <button class="btn" onclick="editSchemaModal('${state.sub}')">Edit Schema</button>
        <button class="btn" onclick="itemModal()">+ Item</button>
      </div>
    `;
      let ths = cols.map(c => th(c, c)).join('');

      let sortedData = sortData([...state.data]);

      let rows = sortedData.map(d => `
      <tr onclick="itemModal('${d.id}')">
        <td onclick="event.stopPropagation()"><input type="checkbox" onchange="toggleSelect('${d.id}', this.checked)" ${state.selected.has(String(d.id)) ? 'checked' : ''}></td>
        ${cols.map(c => {
        let val = d[c];
        let sc = state.schema.find(s => s.name === c);
        if (sc && sc.type === 'bool') {
          return `<td>${(val === true || val === 1 || val === 'true') ? 'true' : 'false'}</td>`;
        }
        return `<td>${val !== undefined && val !== null ? val : ''}</td>`;
      }).join('')}
      </tr>
    `).join('');


      document.getElementById('pane-content').innerHTML = `
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead><tr><th style="width:30px"></th>${ths}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
    }

    function toggleSelect(id, checked) {
      let strId = String(id);
      checked ? state.selected.add(strId) : state.selected.delete(strId);
      document.getElementById('selection-popup').classList.toggle('show', state.selected.size > 0);
    }

    function clearSelection() {
      state.selected.clear();
      document.getElementById('selection-popup').classList.remove('show');
      renderCollectionTable();
    }

    let searchTimeout;
    function debounceSearch(val) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        state.search = val;
        viewCollection(state.sub);
        setTimeout(() => {
          let inp = document.getElementById('coll-search');
          if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        }, 50);
      }, 300);
    }

    async function deleteSelected() {
      await api(`/collections/${state.sub}?ids=${Array.from(state.selected).join(',')}`, { method: 'DELETE' });
      clearSelection();
      viewCollection(state.sub);
    }

    async function deleteCollection(name) {
      if (confirm(`Are you sure you want to delete the collection '${name}' and all its data? This action cannot be undone.`)) {
        await api(`/collections/${name}`, { method: 'DELETE' });
        state.sub = '';
        document.getElementById('pane-header').innerHTML = '';
        document.getElementById('pane-content').innerHTML = '';
        loadCollections();
      }
    }

    function itemModal(id = null) {
      const item = id ? state.data.find(d => d.id == id) : {};
      let html = ``;
      state.schema.forEach(f => {
        if (f.name === 'id' || f.name === 'created' || f.name === 'updated') return;
        let val = item[f.name] !== undefined && item[f.name] !== null ? item[f.name] : '';

        if (f.type === 'bool') {
          html += `<div class="form-check"><label><span>${f.name}</span> <input type="checkbox" id="f_${f.name}" ${val === true || val === 1 || val === 'true' ? 'checked' : ''}></label></div>`;
        } else if (f.type === 'number') {
          html += `<div class="form-field"><input type="number" step="any" id="f_${f.name}" value="${val}" placeholder=" "><label>${f.name}</label></div>`;
        } else if (f.type && f.type.startsWith('relation:')) {
          let target = f.type.split(':')[1];
          html += `
            <div class="hbox">
              <div class="form-field" style="flex:1">
                <input type="text" id="f_${f.name}" value="${val}" placeholder="" readonly>
                <label>${f.name}</label>
              </div>
              <button class="btn secondary" onclick="openRelSelect('${f.name}', '${target}')">Select: ${target}</button>
            </div>
            
          `;
        } else {
          html += `<div class="form-field"><input type="text" id="f_${f.name}" value="${val}" placeholder=" "><label>${f.name}</label></div>`;
        }
      });

      document.getElementById('modal-title').innerText = `${id ? 'Edit' : 'New'} Item`;
      document.getElementById('modal-body').innerHTML = html + `<div class="hbox"><button id="modal-confirm-btn" class="btn" onclick="saveItem(${id})">Save</button> <button class="btn danger" onclick="closeModal()">Cancel</button></div>`;
      document.getElementById('modal').style.display = 'flex';
    }

    async function saveItem(id) {
      let payload = {};
      state.schema.forEach(f => {
        if (f.name === 'id' || f.name === 'created' || f.name === 'updated') return;
        let el = document.getElementById(`f_${f.name}`);
        if (el) {
          if (f.type === 'bool') {
            payload[f.name] = el.checked;
          } else if (f.type === 'number') {
            payload[f.name] = el.value !== '' ? parseFloat(el.value) : null;
          } else {
            payload[f.name] = el.value;
          }
        }
      });
      await api(`/collections/${state.sub}${id ? '/' + id : ''}`, { method: id ? 'PUT' : 'POST', body: payload });
      closeModal();
      viewCollection(state.sub);
    }

    function editSchemaModal(name = '') {
      const isNew = !name;
      let schema = isNew ?[] : state.schema;
      window._tempSchema = [...schema];
      window._tempColName = name || '';

      let isInitialRender = true;
      function render() {
        if (!isInitialRender && document.getElementById('col-name')) window._tempColName = document.getElementById('col-name').value;
        isInitialRender = false;
        let html = ``;
        if (isNew) html += `<div class="form-field"><input id="col-name" placeholder="" required value="${window._tempColName}"><label>Collection name</label></div>`;

        html += `<div id="schema-fields-container" style="position:relative; display:flex; flex-direction:column; gap:8px;">`;
        html += window._tempSchema.map((f, i) => {
          let baseType = f.type;
          let relTarget = '';
          if (f.type && f.type.startsWith('relation:')) {
            baseType = 'relation';
            relTarget = f.type.split(':')[1];
          }
          let allCols = state.collections.map(c => `<option value="${c.name}" ${c.name === relTarget ? 'selected' : ''}>${c.name}</option>`).join('');

          return `
        <div class="hbox schema-row" data-index="${i}" style="background: var(--card-bg)">
          <div class="handle" style="cursor:grab" onpointerdown="startDrag(event, ${i})">⣿</div>
          <div class="form-field" style="flex:1"><input value="${f.name}" onchange="_tempSchema[${i}].name=this.value" ${f.name === 'id' ? 'disabled' : ''} placeholder=" "><label>Field name</label></div>
          <select onchange="if(this.value==='relation'){ _tempSchema[${i}].type='relation:'+(state.collections[0]?state.collections[0].name:''); } else { _tempSchema[${i}].type=this.value }; renderSchemaModal()" ${f.name === 'id' ? 'disabled' : ''}>
            <option value="string" ${baseType === 'string' ? 'selected' : ''}>String</option>
            <option value="number" ${baseType === 'number' ? 'selected' : ''}>Number</option>
            <option value="bool" ${baseType === 'bool' ? 'selected' : ''}>Bool</option>
            <option value="relation" ${baseType === 'relation' ? 'selected' : ''}>Relation</option>
          </select>
          ${baseType === 'relation' ? `<select onchange="_tempSchema[${i}].type='relation:'+this.value">${allCols}</select>` : ''}
          <button class="btn danger" style="width: 1.5rem; height: 1.5rem; padding: 0.15rem 0 0 0;" ${f.name === 'id' ? 'disabled' : 'onclick="_tempSchema.splice(' + i + ',1); renderSchemaModal()"'}>✕</button>
        </div>
      `}).join('');
        html += `</div>`;
        html += `<div style="margin-top: 1rem;"><button class="btn" onclick="_tempSchema.push({name:'', type:'string'}); renderSchemaModal()">+ Add field</button></div>
      <div style="margin-top: 1rem;"><button id="modal-confirm-btn" class="btn" onclick="saveSchema('${name}')">Save collection</button> <button class="btn danger" onclick="closeModal()">Cancel</button></div>`;

        document.getElementById('modal-title').innerText = `${isNew ? 'New' : 'Edit'} Collection`;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('modal').style.display = 'flex';
      }
      window.renderSchemaModal = render;
      render();
    }

    async function saveSchema(name) {
      let schema = window._tempSchema.filter(f => f.name.trim() !== '');
      let targetName = name;
      if (!name) {
        targetName = document.getElementById('col-name').value;
        await api(`/collections`, { method: 'POST', body: { name: targetName, schema } });
      } else {
        await api(`/collections/${name}`, { method: 'PUT', body: { schema } });
      }
      closeModal();
      await loadCollections();
      if (targetName) viewCollection(targetName);
    }

      document.getElementById('pane-header').innerHTML = `<h2>API Keys</h2><button class="btn" onclick="keyModal()">+ New Key</button>`;
      state.keys = await api('/keys');
      renderKeysTable();

      let rows = sorted.map(k => `<tr onclick="viewKeyModal(${k.id})">

    async function saveKey() {
      let perms = {};
      perms.collections = {};
      if (document.getElementById('pk_all_cols').checked) {
        perms.collections["*"] = ["item", "schema"];
      } else {
        document.querySelectorAll('[id^="pk_i_"]').forEach(el => {
          let name = el.id.substring(5);
          if (el.checked || document.getElementById(`pk_s_${name}`).checked) {
            if (!perms.collections[name]) perms.collections[name] =[];
            if (el.checked) perms.collections[name].push("item");
            if (document.getElementById(`pk_s_${name}`).checked) perms.collections[name].push("schema");
          }
        });
      }["routes", "public", "schedules", "settings", "keys"].forEach(k => { if (document.getElementById(`pk_${k}`).checked) perms[k] = true; });

      let name = document.getElementById('k-name').value;
      await api('/keys', { method: 'POST', body: { name, permissions: perms } });
      closeModal();
      loadKeys();
    }

    async function deleteKey(id) { if (confirm("Delete Key?")) { await api(`/keys?id=${id}`, { method: 'DELETE' }); loadKeys(); } }

    }

    async function saveSettings() {
      let mode = document.querySelector('input[name="bkp_cron_mode"]:checked').value;
      let schedule = 'Disabled';
      let meta = { mode: mode };

      if (mode === 'raw') {
        schedule = document.getElementById('s-bkp-sch').value;
      } else if (mode === 'interval') {
        let d = document.getElementById('s-bkp-d').value;
        let h = document.getElementById('s-bkp-h').value;
        let m = document.getElementById('s-bkp-m').value;
        let s = document.getElementById('s-bkp-s').value;
        if (d) meta.d = d;
        if (h) meta.h = h;
        if (m) meta.m = m;
        if (s) meta.s = s;
        schedule = "Interval";
      }

      let payload = {
        port: parseInt(document.getElementById('s-port').value, 10) || 8080,
        backup_dest_dir: document.getElementById('s-bkp-dir').value,
        backup_full: document.querySelector('input[name="bkp_scope"]:checked').value === 'all',
        backup_sched: schedule,
        backup_sched_meta: JSON.stringify(meta),
        allowed_origins: document.getElementById('s-origins').value,
        rate_limit_rps: parseFloat(document.getElementById('s-pub-rps').value),
        rate_limit_burst: parseInt(document.getElementById('s-pub-burst').value, 10),
        admin_max_retries: parseInt(document.getElementById('s-adm-retries').value, 10),
        log_retention_days: parseInt(document.getElementById('s-log-ret').value, 10),
        unsafe_lua: document.getElementById('set_unsafe_lua').checked,
      };
      await api('/settings', { method: 'POST', body: payload });
      state.settings = payload;
      document.getElementById('btn-save-settings').disabled = true;
    }

    // ---------- relations nested modal ----------
    let relSearchTimeout;
    async function openRelSelect(fieldName, targetCol, search = '') {
      document.getElementById('rel-modal-title').innerText = `Select ${fieldName} from ${targetCol}`;
      document.getElementById('rel-modal').style.display = 'flex';

      const res = await api(`/collections/${targetCol}?search=${encodeURIComponent(search)}`);
      let items = res.items ||[];

      let html = `<div class="form-field">
        <input type="text" id="rel-search-inp" placeholder="" value="${search}" oninput="clearTimeout(relSearchTimeout); relSearchTimeout=setTimeout(()=>openRelSelect('${fieldName}', '${targetCol}', this.value), 300)">
        <label>Search...</label>
      </div>`;

      if (items.length === 0) {
        html += `<div style="padding:1rem; text-align:center;">No items found.</div>`;
      } else {
        const colDef = state.collections.find(c => c.name === targetCol);
        let schema = colDef ? colDef.schema || [] : [];
        const cols =['id', ...schema.map(s => s.name)];
        let ths = cols.map(c => `<th style="position: sticky; top: 0;">${c}</th>`).join('');

        html += `<div style="width: 100%; overflow-x: auto; max-height: 480px; position: relative;">
          <table class="data-table">
            <thead>
              <tr>${ths}</tr>
            </thead>
            <tbody>
              ${items.map(itm => `
                <tr onclick="selectRelItem('${fieldName}', '${itm.id}')" title="Select #${itm.id}">
                  ${cols.map(c => {
          let val = itm[c];
          let sc = schema.find(s => s.name === c);
          if (sc && sc.type === 'bool') {
            return `<td>${(val === true || val === 1 || val === 'true') ? 'true' : 'false'}</td>`;
          }
          return `<td>${val !== undefined && val !== null ? val : ''}</td>`;
        }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
      }

      html += `<button class="btn danger" onclick="closeModal()">Cancel</button>`;

      document.getElementById('rel-modal-body').innerHTML = html;
      setTimeout(() => {
        let inp = document.getElementById('rel-search-inp');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }, 50);
    }

    function closeRelModal() { document.getElementById('rel-modal').style.display = 'none'; }
    function selectRelItem(fieldName, id) {
      document.getElementById(`f_${fieldName}`).value = id;
      closeRelModal();
    }


    // ---------- files & tree ----------
    async function loadFiles(base) {
      let folderName = base;
      const res = await api(`/files?base=${base}`);
      const files = res ||[];
      let tree = {};
      files.forEach(f => {
        let parts = f.path.split('/');
        let cur = tree;
        for (let i = 0; i < parts.length; i++) {
          let p = parts[i];
          if (i === parts.length - 1) cur[p] = f.is_dir ? {} : null;
          else { if (!cur[p]) cur[p] = {}; cur = cur[p]; }
        }
      });

      function buildHtml(node, prefix = "") {
        let html = "";
        for (let k in node) {
          let path = prefix ? prefix + "/" + k : k;
          if (node[k] === null) {
            html += `<li class="tree-item" data-path="${esc(path)}" onclick="editFile('${base}', '${esc(path)}')">
            <span class="tree-label" title="${k}">📄 ${k}</span>
            <div class="tree-actions">
              <span class="del" onclick="event.stopPropagation(); deleteFile('${base}', '${esc(path)}')" title="Delete File"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
            </div>
          </li>`;
          } else {
            html += `<details>
            <summary class="tree-item" data-path="${esc(path)}">
              <span class="tree-label" title="${k}">📁 ${k}</span>
              <div class="tree-actions">
                <span onclick="event.preventDefault(); newFileModal('${base}', '${esc(path)}')" title="New in Folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14"/></svg></span>
                <span class="del" onclick="event.preventDefault(); deleteFile('${base}', '${esc(path)}')" title="Delete Folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
              </div>
            </summary>
            <ul>${buildHtml(node[k], path)}</ul>
          </details>`;
          }
        }
        return html;
      }

      let subHtml = "";
      if (base === 'schedules') subHtml += `<div id="edit-schedules-btn" class="sub-item" onclick="loadCronJobs()">Edit Schedules...</div><hr>`;

      subHtml += `
      <div class="file-tree">
        <div>
          <details open>
            <summary class="tree-item root-item">
              <span class="tree-label">📁 ${folderName}</span>
              <div class="tree-actions">
                <span onclick="event.preventDefault(); newFileModal('${base}', '')" title="New file/folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14"/></svg></span>
              </div>
            </summary>
            <ul>${buildHtml(tree) || `<i class="text-muted ml-6 text-sm">empty folder</i>`}</ul>
          </details>
          
        </div>
      </div>
    `;

      document.getElementById('sub-sidebar').innerHTML = subHtml;
      document.getElementById('pane-content').innerHTML = ``;
      if (base === 'schedules') loadCronJobs();
    }

    const extMap = { 'js': 'javascript', 'ts': 'typescript', 'py': 'python', 'sh': 'bash', 'md': 'markdown' };

async function editFile(base, path) {
      document.querySelectorAll('.sub-sidebar .sub-item, .sub-sidebar .tree-item').forEach(el => el.classList.remove('active'));
      let activeItem = document.querySelector(`.sub-sidebar .tree-item[data-path="${esc(path)}"]`);
      if (activeItem) activeItem.classList.add('active');

      let apiBtnHtml = '';
      if (path.endsWith('.lua')) {
        apiBtnHtml = `<button class="btn secondary" onclick="showApiDocs()">API</button> `;
      }

      document.getElementById('pane-header').innerHTML = `
      <h2 style="font-family: monospace; font-size:1.2rem;">${path}</h2>
      <div>${apiBtnHtml}<button id="btn-save-file" class="btn" disabled onclick="saveFile('${base}', '${esc(path)}')" title="Ctrl+S">Save changes</button></div>
    `;
      if (path.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
        document.getElementById('pane-content').innerHTML = `<img src="/api/files?base=${base}&path=${path}&raw=true" style="max-width:100%;max-height:80vh">`;
      } else {
        const res = await api(`/files?base=${base}&path=${path}`);
        
        // Store the baseline content to compare against
        state.currentFileContent = res.content; 
        
        let ext = path.split('.').pop().toLowerCase();
        ext = extMap[ext] || ext;

        document.getElementById('pane-content').innerHTML = `
          <div id="file-editor" style="height:calc(100% - 1rem); width:100%;"></div>`;

        if (window.editor) window.editor.remove();

        let edTheme = localStorage.getItem('mogo_editor_theme') || 'auto';
        let edTabSize = parseInt(localStorage.getItem('mogo_editor_tabSize') || '3', 10);
        let edInsertSpaces = localStorage.getItem('mogo_editor_insertSpaces') === 'true';
        let edWordWrap = localStorage.getItem('mogo_editor_wordWrap') !== 'false';
        
        let adminTheme = localStorage.getItem('mogo_theme') || 'auto';
        if (adminTheme === 'auto') {
          adminTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        
        let isDark = edTheme === 'dark' || (edTheme === 'auto' && adminTheme === 'dark');

        window.editor = createEditor('#file-editor', {
          language: ext,
          value: res.content,
          tabSize: edTabSize,
          insertSpaces: edInsertSpaces,
          wordWrap: edWordWrap,
          onUpdate(code) {
            const btn = document.getElementById('btn-save-file');
            if (btn) {
              // Only enable the save button if the content actually changed
              if (code !== state.currentFileContent) {
                btn.disabled = false;
              } else {
                btn.disabled = true;
              }
            }
          }
        });

        if (isDark) {
          document.getElementById('file-editor').classList.add('editor-dark');
        }
      }
    }

    function showApiDocs() {
      // ... (keep your existing showApiDocs function here) ...
      document.getElementById('modal-title').innerText = "Lua Global API docs";
      document.getElementById('modal-body').innerHTML = `
         <div style="font-size:0.9em; line-height:1.5;">
           <p style="margin-bottom:8px">These globals are injected into Lua routes and schedules:</p>
           <ul style="padding-left:1.5rem; margin-bottom:1rem;">
             <li><code>log.info(msg) / log.warn(msg) / log.error(msg)</code> - Write to application log DB</li>
             <li><code>http.get(url)</code> - HTTP GET request</li>
             <li><code>http.request(url, params)</code> - HTTP request (params: method, headers, body)</li>
           </ul>
           <p style="margin-bottom:8px">In Lua routes, you have access to the <code>req</code> object:</p>
           <ul style="padding-left:1.5rem;">
             <li><code>req.query.abc</code> - URL query parameters</li>
             <li><code>req.form.abc</code> / <code>req.body.abc</code> - Form/JSON parsed body</li>
             <li><code>req.files.myFile</code> - Uploaded files (with <code>:save(dest)</code>, <code>.size</code>, <code>.filename</code>)</li>
           </ul>
         </div>
       `;
      document.getElementById('modal').style.display = 'flex';
    }

    function showApiDocs() {
      document.getElementById('modal-title').innerText = "Lua Global API docs";
      document.getElementById('modal-body').innerHTML = `
         <div style="font-size:0.9em; line-height:1.5;">
           <p style="margin-bottom:8px">These globals are injected into Lua routes and schedules:</p>
           <ul style="padding-left:1.5rem; margin-bottom:1rem;">
             <li><code>log.info(msg) / log.warn(msg) / log.error(msg)</code> - Write to application log DB</li>
             <li><code>http.get(url)</code> - HTTP GET request</li>
             <li><code>http.request(url, params)</code> - HTTP request (params: method, headers, body)</li>
           </ul>
           <p style="margin-bottom:8px">In Lua routes, you have access to the <code>req</code> object:</p>
           <ul style="padding-left:1.5rem;">
             <li><code>req.query.abc</code> - URL query parameters</li>
             <li><code>req.form.abc</code> / <code>req.body.abc</code> - Form/JSON parsed body</li>
             <li><code>req.files.myFile</code> - Uploaded files (with <code>:save(dest)</code>, <code>.size</code>, <code>.filename</code>)</li>
           </ul>
         </div>
       `;
      document.getElementById('modal').style.display = 'flex';
    }


    async function saveFile(base, path) {
      let content = window.editor ? window.editor.value : document.getElementById('file-editor').value;
      let btn = document.getElementById('btn-save-file');
      btn.innerText = "Saving...";
      
      await api(`/files?base=${base}`, { method: 'POST', body: { path: path, content: content, is_dir: false } });
      
      // Update baseline content to the newly saved state
      state.currentFileContent = content; 
      
      btn.disabled = true;
      btn.innerText = "Save changes";
    }

    async function deleteFile(base, path) {
      if (confirm('Delete?')) {
        await api(`/files?base=${base}&path=${path}`, { method: 'DELETE' });
        loadFiles(base);
      }
    }

    function newFileModal(base, targetFolder) {
      let folderName = base;
      let title = targetFolder ? `New in /${targetFolder}` : `New in /${folderName}`;
      let html = `<div class="form-field">
        <select id="nf-type">
          <option value="file">File</option>
          <option value="folder">Folder</option>
        </select>
        <label class="always-float">Type</label>
      </div>
      <div class="form-field">
        <input id="nf-name" placeholder="" required>
        <label>Name</label>
      </div>
      <div>
        <button id="modal-confirm-btn" class="btn" onclick="createFile('${base}', '${esc(targetFolder)}')">Create</button> 
        <button class="btn danger" onclick="closeModal()">Cancel</button>
      </div>`;
      openModal(title, html);
    }

    async function createFile(base, targetFolder) {
      let name = document.getElementById('nf-name').value;
      let type = document.getElementById('nf-type').value;
      if (!name) return;

      let isDir = type === 'folder';
      let path = targetFolder ? targetFolder + '/' + name : name;
      
      let content = "";
      if (!isDir) {
        if (base === 'routes') {
          content = "return {\n  GET = function(req)\n    return \"<h1>Hello, world!</h1>\"\n  end\n}";
        } else if (base === 'schedules') {
          content = "log.info(\"Hello, world!\")";
        } else {
          content = "Hello, world!";
        }
      }

      await api(`/files?base=${base}`, { method: 'POST', body: { path: path, content: content, is_dir: isDir } });
      closeModal();
      loadFiles(base);
    }

    // ---------- cron jobs ----------
    async function loadCronJobs() {
      document.querySelectorAll('.sub-sidebar .sub-item, .sub-sidebar .tree-item').forEach(el => el.classList.remove('active'));
      let btn = document.getElementById('edit-schedules-btn');
      if (btn) btn.classList.add('active');

      document.getElementById('pane-header').innerHTML = `<h2>Schedules</h2><button class="btn" onclick="cronModal()">+ New Schedule</button>`;
      state.crons = await api('/crons');
      renderCronsTable();
    }

    function renderCronsTable() {
      let sorted = sortData([...state.crons]);
      let rows = sorted.map(j => {
        let schedText = j.schedule;
        if (j.schedule_meta) {
          try {
            let meta = JSON.parse(j.schedule_meta);
            if (meta.mode === 'interval') {
              let parts =[];
              if (meta.d) parts.push(meta.d + 'd');
              if (meta.h) parts.push(meta.h + 'h');
              if (meta.m) parts.push(meta.m + 'm');
              if (meta.s) parts.push(meta.s + 's');
              if (parts.length > 0) schedText = "Every " + parts.join(' ');
            }
          } catch (e) { }
        }
        return `<tr onclick="cronModal(${j.id})">
        <td>${j.name}</td><td>${schedText}</td><td>${j.script_path}</td><td>${j.active ? 'true' : 'false'}</td>
        <td style="text-align:right"><span class="clickable ml-2" onclick="event.stopPropagation(); deleteCron(${j.id})" title="Delete Job">✕</span></td>
      </tr>`;
      }).join('');
      document.getElementById('pane-content').innerHTML = `
      <table class="data-table"><thead><tr>
        ${th('name', 'Name')}
        ${th('schedule', 'Schedule')}
        ${th('script_path', 'Script')}
        ${th('active', 'Active')}
        <th></th>
      </tr></thead><tbody>${rows}</tbody></table>`;
    }

    window.updateCronUI = function () {
      let mode = document.querySelector('input[name="cron_mode"]:checked').value;
      document.getElementById('cron-raw-sec').style.display = (mode === 'raw') ? 'block' : 'none';
      document.getElementById('cron-interval-sec').style.display = (mode === 'interval') ? 'block' : 'none';
    }

    async function cronModal(id = null) {
      let j = {};
      let mode = 'interval';
      let meta = {};

      if (id) {
        j = state.crons.find(x => x.id == id) || {};
        if (j.active === false) mode = 'disabled';
        else if (j.schedule_meta) {
          try { meta = JSON.parse(j.schedule_meta); mode = meta.mode; } catch (e) { }
        } else {
          mode = 'raw';
        }
      }

      let d = meta.d || '', h = meta.h || '', m = meta.m || '', s = meta.s || '';

      const files = await api('/files?base=schedules') ||[];
      const fileOptions = files.filter(f => !f.is_dir).map(f =>
        `<option value="${f.path}" ${j.script_path === f.path ? 'selected' : ''}>${f.path}</option>`
      ).join('');

      let html = `<div class="form-field"><input id="cj-name" value="${j.name || ''}" placeholder=" "><label>Name</label></div>
      
      <div>
        <div style="font-size: 0.85em; margin-bottom: 0.4rem; color: var(--muted);">Schedule Mode</div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label style="cursor:pointer; display:flex; align-items:center; gap:0.25rem;"><input type="radio" name="cron_mode" value="interval" ${mode === 'interval' ? 'checked' : ''} onchange="updateCronUI()"> Run every...</label>
          <label style="cursor:pointer; display:flex; align-items:center; gap:0.25rem;"><input type="radio" name="cron_mode" value="raw" ${mode === 'raw' ? 'checked' : ''} onchange="updateCronUI()"> Cron</label>
          <label style="cursor:pointer; display:flex; align-items:center; gap:0.25rem;"><input type="radio" name="cron_mode" value="disabled" ${mode === 'disabled' ? 'checked' : ''} onchange="updateCronUI()"> Disabled</label>
        </div>
      </div>

      <div id="cron-raw-sec" style="display:${mode === 'raw' ? 'block' : 'none'};">
        <div style="font-size:0.85rem; color:var(--muted); margin-bottom:0.5rem;">
            Note: This uses a 6-field (quartz-style) cron expression. <a href="https://www.6-cron.com/" target="_blank" style="color:var(--accent)">Learn more</a>
        </div>
        <div class="form-field"><input id="cj-sch" value="${j.schedule || '0 * * * * *'}" placeholder=" "><label>Schedule (cron)</label></div>
      </div>

      <div id="cron-interval-sec" style="display:${mode === 'interval' ? 'block' : 'none'};">
        <div>
          <div class="form-field"><input type="number" id="ci-day" min="1" value="${d}" placeholder=" "><label>Days</label></div>
          <div class="form-field"><input type="number" id="ci-hr" min="1" value="${h}" placeholder=" "><label>Hours</label></div>
          <div class="form-field"><input type="number" id="ci-min" min="1" value="${m}" placeholder=" "><label>Minutes</label></div>
          <div class="form-field"><input type="number" id="ci-sec" min="1" value="${s}" placeholder=" "><label>Seconds</label></div>
        </div>
      </div>

      <div class="form-field">
        <select id="cj-scr" style="width:100%; margin:0;">
          <option value="" disabled ${!j.script_path ? 'selected' : ''}>Select a script...</option>
          ${fileOptions}
        </select>
        <label class="always-float">Lua Script Path</label>
      </div>

      <div class="text-right mt-2" style="margin-top:1rem"><button id="modal-confirm-btn" class="btn" onclick="saveCron(${id})">Save</button> <button class="btn danger" onclick="closeModal()">Cancel</button></div>`;
      openModal(`${id ? 'Edit' : 'New'} Cron Job`, html);
    }

    async function saveCron(id) {
      let mode = document.querySelector('input[name="cron_mode"]:checked').value;
      let schedule = document.getElementById('cj-sch')?.value || '0 * * * * *';
      let active = (mode !== 'disabled');
      let meta = { mode: mode };

      if (mode === 'interval') {
        let d = document.getElementById('ci-day').value;
        let h = document.getElementById('ci-hr').value;
        let m = document.getElementById('ci-min').value;
        let s = document.getElementById('ci-sec').value;

        if (d) meta.d = d;
        if (h) meta.h = h;
        if (m) meta.m = m;
        if (s) meta.s = s;

        schedule = "Interval";
      }

      await api('/crons', {
        method: 'POST', body: {
          id: id,
          name: document.getElementById('cj-name').value,
          schedule: schedule,
          schedule_meta: JSON.stringify(meta),
          script_path: document.getElementById('cj-scr').value,
          active: active
        }
      });

      closeModal();
      loadCronJobs();
    }

    async function deleteCron(id) { if (confirm("Delete Job?")) { await api(`/crons?id=${id}`, { method: 'DELETE' }); loadCronJobs(); } }

    // modal utils
    function openModal(title, html) { document.getElementById('modal-title').innerText = title; document.getElementById('modal-body').innerHTML = html; document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('rel-modal').style.display = 'none'; }

    init();
  </script>
</body>
